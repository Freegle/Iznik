# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# The whole build must fit the 8GB CI container (docker `large`; xlarge is not
# in the CircleCI plan - see android-executor in the orb). The release-bundle
# kill (reported only as "daemon disappeared unexpectedly") happens AFTER R8
# and lintVital complete, in the packageReleaseBundle phase: G1 keeps the heap
# committed at R8's high-water mark, and packaging the AAB (which carries the
# whole Nuxt asset bundle) allocates on top of that bloat until the container
# cap is crossed. So: a slightly lower ceiling, plus periodic full GCs that
# uncommit heap between build phases so packaging does not inherit R8's RSS,
# and capped worker concurrency for the per-module lint tasks. If R8 ever
# fails with a Java-level OutOfMemoryError here, raise -Xmx before touching
# anything else - the container kill and the Java OOM are different failures.
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m -XX:G1PeriodicGCInterval=45000 -XX:G1PeriodicGCSystemLoadThreshold=0 -XX:-G1PeriodicGCInvokesConcurrent -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# No Kotlin sources compile in this project today (the R8 kotlin-metadata
# warnings come from library metadata), but if a plugin update ever spawns the
# Kotlin daemon, keep it from defaulting to a multi-GB heap.
kotlin.daemon.jvmargs=-Xmx768m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

