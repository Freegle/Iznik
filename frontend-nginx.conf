# frontend-nginx.conf — front door for the `edge` (front-end host) Compose profile.
#
# Replaces, on a dedicated Katapult VM:
#   - app1's delivery cache nginx (delivery.ilovefreegle.org → wsrv.nl) and tusd
#     proxy (uploads.ilovefreegle.org), and
#   - this docker host's tiles/geocode/wiki nginx vhosts.
#
# See plans/2026-06-25-frontend-server-migration.md (§2, §5, §10) for the
# load-bearing facts encoded below. This file is consumed ONLY by the
# `frontend-nginx` service, which only runs under the `edge` profile — so dev/CI
# never load it.
#
# Validate before use:  nginx -t  (the upstreams use `set $x …; proxy_pass $x;`
# plus the Docker resolver, so the config parses with NO backends present).
#
# This file is an envsubst TEMPLATE. The nginx image renders it to
# /etc/nginx/nginx.conf at start, substituting ONLY ${IMAGE_STORE_*} (compose
# sets NGINX_ENVSUBST_FILTER=^IMAGE_STORE_); every other $variable below is
# nginx's own and is left alone. Without that filter envsubst would blank them
# all and nginx -t fails loudly, so a wrong filter cannot pass silently.

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;   # to Docker logs → promtail → Loki (edge observability)
pid        /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections  8192;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Docker's embedded DNS — lets `set $x http://service; proxy_pass $x;` resolve
    # at request time, so the config validates (`nginx -t`) without backends up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    log_format  main  '$remote_addr - $remote_user [$time_iso8601] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" cache=$upstream_cache_status rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # --- PROXY protocol / real client IP ----------------------------------
    # In prod HAProxy (ha-internal) reaches our :80 with `send-proxy`, so every
    # :80 listener below is `proxy_protocol` and we recover the client IP from
    # the PROXY header. :8080 (tusd) is reached plain. (Open decision §12.6:
    # send-proxy vs XFF — switch real_ip_header to X-Forwarded-For if dropped.)
    set_real_ip_from 10.220.0.0/22;   # internal net (ha-internal / applb)
    set_real_ip_from 172.16.0.0/12;   # docker bridge (dev validation)
    set_real_ip_from 127.0.0.1;       # local PROXY-framing test
    real_ip_header proxy_protocol;

    # --- Delivery (weserv) cache ------------------------------------------
    # Mirror app1's cache exactly so the warm-started 41 GB cache is reusable.
    # The cache KEY is pinned to the wsrv.nl form (verified from a live cache
    # file's `KEY:` header) even though our upstream is the LOCAL weserv
    # container — otherwise the warm-started entries orphan.
    proxy_cache_path /var/cache/nginx/wsrv_cache levels=1:2 keys_zone=wsrv_cache:100m
                     max_size=40g inactive=30d use_temp_path=off;

    # ======================================================================
    # uploads.ilovefreegle.org   (NO CORS here — HAProxy adds it)
    #   :80  proxy_protocol  (HAProxy send-proxy)
    #   :8080 plain          (the upload-URL form used by apps/Freebie Alerts;
    #                         kept indefinitely — §2). Default for :8080.
    #
    # Every tus protocol request (POST, PATCH, HEAD, DELETE, OPTIONS) goes to
    # tusd, which writes to a local spool. A GET for an upload id is answered by
    # the first place that has it:
    #   1. the spool, via tusd - a local stat, so a just-finished upload that
    #      the member is already looking at is found here;
    #   2. the object store, at IMAGE_STORE_PUBLIC_URL + <id> - where
    #      images:push-spool puts every completed upload within a minute or so;
    #   3. the legacy NFS share, bound read-only at /images and served as plain
    #      static files - everything uploaded before the spool existed, until
    #      images:migrate-legacy has copied it all. Not through tusd: tusd
    #      creates a lock file even on GET, which a read-only mount refuses.
    # Nothing in the URL says where a file is, which is what lets the copy run
    # for as long as it needs to with nobody noticing. When verify reports the
    # legacy store empty of anything referenced, delete @legacy_store, the
    # error_page that reaches it, and the /images bind in compose.
    #
    # A GET for / or anything that is not an upload id goes to tusd as before
    # (it answers 405 / 404), so health probes behave exactly as they did.
    # ======================================================================
    server {
        listen 80 proxy_protocol;
        listen 8080 default_server;
        server_name uploads.ilovefreegle.org;

        client_max_body_size 0;   # tus streams arbitrarily large uploads
        recursive_error_pages on; # the read chain is two error_page hops deep

        # tusd's bookkeeping beside each upload is never content. tusd itself
        # would 404 these (it looks for <id>.info.info); the bucket and the
        # legacy share must not be asked either.
        location ~ \.(info|part|lock|stop)$ {
            return 404;
        }

        location / {
            # Reads of an upload take the chain below; everything else is tus.
            # (`if` + `rewrite ... last` is one of the documented-safe forms.)
            if ($request_method = GET) {
                rewrite ^/([A-Za-z0-9_-]+)$ /_get/$1 last;
            }

            set $tusd_upstream http://tusd:8080;
            proxy_pass $tusd_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Pin https, not $scheme. This vhost is only reached via HAProxy,
            # which terminates TLS, so the client-facing scheme is always https.
            # $scheme is the http of the internal HAProxy→nginx hop; forwarding
            # that makes tusd `-behind-proxy` build an http:// Location header.
            # A server-side tus client PATCHing to that http URL gets a 302 to
            # https and drops the body, so the upload silently fails (this is how
            # AI illustrations and TN photo scrapes are stored). Pinning https
            # makes tusd emit an https Location that PATCHes straight through.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "";
            # Deliberately NO Access-Control-* headers: app1 tusd runs
            # `-disable-cors` and ALL tus CORS comes from HAProxy tusd_backend.
        }

        # 1. The spool. Internal only: reached by the rewrite above.
        location ~ ^/_get/(?<upload_id>[A-Za-z0-9_-]+)$ {
            internal;
            # Captures do not survive an error_page redirect; a set variable does.
            set $img_id $upload_id;

            set $tusd_upstream http://tusd:8080;
            proxy_pass $tusd_upstream/$img_id;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection        "";

            proxy_intercept_errors on;
            error_page 404 = @object_store;
        }

        # 2. The object store, anonymous read. A bucket that is not actually
        # public answers 403 to every key, which the chain below would hide by
        # falling through to legacy: that is why the runbook's
        # images:object-store-check must pass before this is enabled.
        location @object_store {
            proxy_pass ${IMAGE_STORE_PUBLIC_URL}$img_id;
            proxy_http_version 1.1;
            proxy_set_header Host       $proxy_host;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            # The bucket's own bookkeeping headers are noise to the resizer.
            proxy_hide_header x-amz-request-id;
            proxy_hide_header x-amz-id-2;

            proxy_intercept_errors on;
            error_page 403 404 = @legacy_store;
        }

        # 3. The legacy NFS share, read-only, until the copy is verified. One
        # stat and a sendfile; $img_id is [A-Za-z0-9_-]+ so it cannot leave
        # /images. Uploads have no extension, so the type is octet-stream; the
        # resizer sniffs the bytes and has never used the origin's type.
        location @legacy_store {
            root /images;
            try_files /$img_id =404;
        }
    }

    # ======================================================================
    # delivery.ilovefreegle.org → local weserv container (cached)
    # ======================================================================
    server {
        listen 80 proxy_protocol;
        server_name delivery.ilovefreegle.org;

        location / {
            proxy_cache wsrv_cache;
            proxy_cache_key "https://wsrv.nl$request_uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 301 410 30d;
            proxy_cache_valid 429 500 502 503 504 0;
            # Negative/other responses (incl 404) cached 5m — matches app1's
            # `proxy_cache_valid any 5m`. Kept short so a transient upstream 404
            # (e.g. a delivery request racing ahead of an in-progress upload)
            # self-heals fast rather than sticking. (Was 15m; a broken-tusd
            # window on 2026-07-08 cached 404s for existing images for 15m.)
            proxy_cache_valid any 5m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            # weserv emits its own X-Cache-Status (its tiny inner cache); hide it
            # so the front door exposes exactly one — our 41 GB cache's status,
            # which is what cutover HIT-rate measurement (§10) must read.
            proxy_hide_header X-Cache-Status;
            add_header X-Cache-Status $upstream_cache_status always;

            # Upstream is the local weserv container's PUBLIC (default) server,
            # which runs its own engine + small cache. Do NOT send
            # Host: images.weserv.local — that is weserv's internal
            # localhost-only engine vhost (allow 127.0.0.1; deny all → 403).
            set $delivery_upstream http://delivery:80;
            proxy_pass $delivery_upstream;
            proxy_set_header Host             $host;
            proxy_set_header X-Forwarded-For  $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # weserv may 301/302 to the origin image; follow once so the
            # cached object is the final image, matching app1 behaviour.
            proxy_intercept_errors on;
            recursive_error_pages on;
            error_page 301 302 307 = @handle_redirect;
        }

        location @handle_redirect {
            set $redirect_target $upstream_http_location;
            proxy_pass $redirect_target;
            proxy_cache wsrv_cache;
            proxy_cache_key "https://wsrv.nl$request_uri";
            proxy_hide_header X-Cache-Status;
            add_header X-Cache-Status $upstream_cache_status always;
        }
    }

    # ======================================================================
    # tiles.ilovefreegle.org → overv tile-server  (EXACTLY ONE ACAO)
    #   Run tile-server with ALLOW_CORS=disabled so it emits zero ACAO; we add
    #   exactly one here. (app1+overv today emit two — the bug §2 calls out.)
    # ======================================================================
    server {
        listen 80 proxy_protocol;
        server_name tiles.ilovefreegle.org;

        add_header Access-Control-Allow-Origin "*" always;

        location / {
            set $tiles_upstream http://tile-server:80;
            proxy_pass $tiles_upstream;
            proxy_set_header Host             $host;
            proxy_set_header X-Forwarded-For  $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # ======================================================================
    # images.ilovefreegle.org — legacy V1 image URL forms, still referenced by
    # old emails and external links (~3-5K req/day, declining). The *img_N.jpg
    # rewrites mirror app1's iznik_images vhost verbatim, but target the apiv2
    # legacy resolver (GET /image) instead of V1 PHP; it 302s on to the
    # delivery CDN / Azure archive / default profile image. Redirect rather
    # than proxy: one extra hop for a dwindling tail keeps the edge free of a
    # dependency on the API tier. Cutover = HAProxy default-backend change for
    # this Host (plan Stage 4); the block is inert until then.
    # ======================================================================
    server {
        listen 80 proxy_protocol;
        server_name images.ilovefreegle.org;

        rewrite ^/img_([0-9]+)\.jpg$   https://api.ilovefreegle.org/apiv2/image?id=$1 redirect;
        rewrite ^/timg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&w=250&h=250 redirect;
        rewrite ^/gimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&group=1 redirect;
        rewrite ^/nimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&newsletter=1 redirect;
        rewrite ^/cimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&communityevent=1 redirect;
        rewrite ^/tcimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&communityevent=1&w=250&h=250 redirect;
        rewrite ^/oimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&volunteering=1 redirect;
        rewrite ^/toimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&volunteering=1&w=250&h=250 redirect;
        rewrite ^/simg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&story=1 redirect;
        rewrite ^/tsimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&story=1&w=250&h=250 redirect;
        rewrite ^/fimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&newsfeed=1 redirect;
        rewrite ^/tfimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&newsfeed=1&w=250&h=250 redirect;
        rewrite ^/mimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&chatmessage=1 redirect;
        rewrite ^/tmimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&chatmessage=1&w=250&h=250 redirect;
        rewrite ^/uimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&user=1 redirect;
        rewrite ^/tuimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&user=1&w=100&h=100 redirect;
        rewrite ^/bimg_([0-9]+)\.jpg$  https://api.ilovefreegle.org/apiv2/image?id=$1&noticeboard=1 redirect;
        rewrite ^/tbimg_([0-9]+)\.jpg$ https://api.ilovefreegle.org/apiv2/image?id=$1&noticeboard=1&w=100&h=100 redirect;

        location = /defaultprofile.png {
            return 302 https://www.ilovefreegle.org/defaultprofile.png;
        }

        # Everything else the old vhost fed into the V1 PHP front (sw.js,
        # /beacon, /api/* passthrough) died with V1, as did booktastic
        # (zimg_ — no V2 table). Gone, permanently.
        location / {
            return 410;
        }
    }

    # ======================================================================
    # users.ilovefreegle.org web — bare redirect, mirroring app1's
    # redirect_users vhost. The <id>@users.ilovefreegle.org MAIL routing is
    # MX/exim and does not come through here (plan §8).
    # ======================================================================
    server {
        listen 80 proxy_protocol;
        server_name users.ilovefreegle.org;
        return 302 https://www.ilovefreegle.org$request_uri;
    }

    # ======================================================================
    # Catch-all — unknown Host gets nothing (no default backend leak).
    # ======================================================================
    server {
        listen 80 proxy_protocol default_server;
        server_name _;
        return 444;
    }

    # ======================================================================
    # Health check — plain listener (NOT proxy_protocol) for the container
    # healthcheck and ops probes.
    # ======================================================================
    server {
        listen 8081;
        server_name _;
        default_type text/plain;
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
