# Microcache for ANONYMOUS wiki reads. MediaWiki declares everything
# private/uncacheable because responses vary by login; that is true only for
# cookied users, so we ignore those headers strictly for cookieless GETs and
# bypass+never-store whenever any session/user cookie is present. Responses
# carrying Set-Cookie (login forms, session starts) are never cached because
# Set-Cookie is deliberately NOT in proxy_ignore_headers.
proxy_cache_path /wikicache levels=1:2 keys_zone=wikicache:20m max_size=500m inactive=1h use_temp_path=off;

server {

  server_name wiki.ilovefreegle.org;

  access_log /var/log/nginx/wiki_access.log combined buffer=16k flush=1m;
  error_log /var/log/nginx/wiki_error.log;

	# Crawlers (meta-externalagent, Amazonbot et al) were walking the infinite
	# Special:RecentChanges parameter space - every limit/days/filter/from combination
	# is a distinct URL and an uncached MediaWiki render - burning ~1 CPU core
	# sustained across wiki-media + wiki-mysql (measured 2026-08-31). Two layers:
	# a real robots.txt (there was none), and a hard 403 for bot UAs on Special:
	# pages, which are noindex-by-nature so this costs no search presence.
	location = /robots.txt {
		default_type text/plain;
		return 200 "User-agent: *\nDisallow: /*?*title=Special:\nDisallow: /*?*title=Special%3A\nDisallow: /api.php\nCrawl-delay: 5\n";
	}

	location / {
		# Special: pages are blocked for declared bots AND for cookieless clients:
		# most of the scraper fleet fakes plain-Chrome UAs (rotating versions,
		# systematic from= walks), but none of it carries a MediaWiki session
		# cookie. Logged-in mods (session cookie) keep full access; articles stay
		# open to everyone including well-behaved crawlers.
		set $wikibot "";
		if ($arg_title ~* "^Special(:|%3A)") {
			set $wikibot "S";
		}
		# Auth pages are exactly the Specials a legitimately cookieless human
		# needs - blocking them locks every logged-out mod out of the wiki. E
		# replaces S so the cookieless-human rule below cannot fire, while
		# declared bots (EU) stay blocked - they have no business logging in.
		if ($arg_title ~* "^Special(:|%3A)(UserLogin|UserLogout|CreateAccount|PasswordReset|ChangePassword)") {
			set $wikibot "E";
		}
		if ($http_user_agent ~* "(bot|crawler|spider|meta-externalagent|bytespider|gptbot|claudebot|petalbot)") {
			set $wikibot "${wikibot}U";
		}
		if ($http_cookie !~* "session") {
			set $wikibot "${wikibot}A";
		}
		if ($wikibot ~ "^(S(U|A|UA)|EU|EUA)$") {
			return 403;
		}

		# Bypass and never store when the client carries any MediaWiki
		# session/user cookie - logged-in mods always hit the backend and
		# their private responses never enter the shared cache.
		set $wiki_nocache 0;
		if ($http_cookie ~* "(session|userid|token)") {
			set $wiki_nocache 1;
		}
		proxy_cache wikicache;
		proxy_cache_bypass $wiki_nocache;
		proxy_no_cache $wiki_nocache;
		proxy_ignore_headers Cache-Control Expires Vary;
		# 24h per Edward (2026-08-31): the wiki changes rarely and there is no
		# purge hook, so TTL = max staleness for ANONYMOUS readers only -
		# logged-in mods always bypass and see their edits instantly.
		proxy_cache_valid 200 24h;
		proxy_cache_valid 301 302 404 10m;
		add_header X-Wiki-Cache $upstream_cache_status always;

    #proxy_read_timeout 300s;
    #proxy_connect_timeout 75s;
		proxy_pass http://127.0.0.1:8088;
		proxy_set_header Host $http_host;
		#proxy_http_version 1.1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
	}

    keepalive_timeout 5m; # up from 3m default


    #listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wiki.ilovefreegle.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.ilovefreegle.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = wiki.ilovefreegle.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



  server_name wiki.ilovefreegle.org;

	listen 80; listen [::]:80;
    return 404; # managed by Certbot


}
