#cloud-config
# Hetzner CI runner bootstrap (PROTOTYPE).
# Boots Ubuntu 24.04 into a CircleCI machine runner registered under freegle/katapult-runner
# (drop-in for a Katapult VM). ${RUNNER_NAME} / ${RUNNER_AUTH_TOKEN} substituted by provision-runner.sh.
# Docker pinned to 27.5.1 (the runner-pinned version) so the Docker-28 host-gateway/Playwright bugs
# never arise. Krystal build cache is intentionally NOT wired up here (follow-up).

package_update: true

write_files:
  - path: /etc/sysctl.d/99-swap.conf
    content: |
      vm.swappiness=10

  # Idle self-destruct (billing-aware), like the Katapult VM. Hetzner bills per STARTED hour, so once
  # we've paid for the hour we stay up to serve builds and only delete near the hour's end. "Busy" =
  # the CI task agent (circleci-agent, EXACT name) is executing OR the freegle-ci compose stack is up.
  # A HARD UPTIME CAP is the real safety net: a completed build leaves its freegle-ci stack running
  # (job teardown deliberately skips `docker compose down` — it raced the idle-check and killed jobs
  # mid-step), which pins the container check "busy" forever. Without a cap the runner NEVER self-reaps
  # (observed 2026-07-11: two runners stuck idle, stacks up, no task agent). Mirrors the Katapult
  # idle-check's 2.5h cap (scripts/configure-katapult-vm.sh). HETZNER_SELF_TOKEN is substituted at
  # provision time; if empty, self-destruct is disabled (an external reaper is expected instead).
  - path: /opt/hetzner-reaper.sh
    content: |
      #!/bin/bash
      TOKEN="${HETZNER_SELF_TOKEN}"
      [ -z "$TOKEN" ] && { echo "no self-token; self-destruct disabled"; exit 0; }
      SID="$(curl -s http://169.254.169.254/hetzner/v1/metadata/instance-id)"
      IDLE_MIN=10; REAP_WINDOW=10; MAX_UPTIME=9000; ZOMBIE_UPTIME=12600; idle_since=""
      reap() { echo "self-destructing: $1 (uptime ${up}s)"; curl -s -X DELETE "https://api.hetzner.cloud/v1/servers/$SID" -H "Authorization: Bearer $TOKEN" -w "\nHTTP %{http_code}\n"; exit 0; }
      while true; do
        now="$(date +%s)"; up="$(awk '{print int($1)}' /proc/uptime)"
        # Task agent alive? -x (exact) so the always-on launch daemon never counts as busy.
        if pgrep -x circleci-agent >/dev/null 2>&1; then agent=1; else agent=0; fi
        # Hard uptime cap — the fix for the leftover-stack-pins-busy trap. max_run_time is 2h so a
        # legit single build can't reach MAX_UPTIME; force-delete past it when no task agent runs.
        # A genuine zombie job that never ends is force-killed at the higher ZOMBIE_UPTIME ceiling.
        [ "$up" -ge "$MAX_UPTIME" ] && [ "$agent" -eq 0 ] && reap "uptime cap, no task agent"
        [ "$up" -ge "$ZOMBIE_UPTIME" ] && reap "zombie uptime ceiling"
        # Busy = task agent running OR the freegle-ci compose stack is up (scoped by compose project).
        if [ "$agent" -eq 1 ] || docker ps -q --filter label=com.docker.compose.project=freegle-ci 2>/dev/null | grep -q .; then
          idle_since=""
        else
          [ -z "$idle_since" ] && idle_since="$now"
        fi
        idle=0; [ -n "$idle_since" ] && idle=$(( now - idle_since ))
        hourpos=$(( up % 3600 ))
        if [ "$idle" -ge $(( IDLE_MIN*60 )) ] && [ "$hourpos" -ge $(( 3600 - REAP_WINDOW*60 )) ]; then
          reap "idle ${idle}s near hour boundary"
        fi
        sleep 60
      done
    permissions: '0755'
  - path: /etc/systemd/system/hetzner-reaper.service
    content: |
      [Unit]
      Description=Idle self-destruct for the Hetzner CI runner
      After=network-online.target
      [Service]
      ExecStart=/opt/hetzner-reaper.sh
      Restart=always
      [Install]
      WantedBy=multi-user.target

runcmd:
  - set -eux
  - systemctl stop apt-daily.timer apt-daily-upgrade.timer unattended-upgrades 2>/dev/null || true
  - systemctl mask apt-daily.timer apt-daily-upgrade.timer unattended-upgrades 2>/dev/null || true
  # 20GB swap (matches Katapult runner)
  - fallocate -l 20G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=20480 status=none
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl -p /etc/sysctl.d/99-swap.conf || true
  # Docker CE pinned to 27.5.1
  - install -m0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update -qq
  - DVER='5:27.5.1-1~ubuntu.24.04~noble'
  - apt-get install -y -qq docker-ce=$DVER docker-ce-cli=$DVER containerd.io docker-compose-plugin sshpass jq
  - apt-mark hold docker-ce docker-ce-cli containerd.io
  - ln -sf /usr/libexec/docker/cli-plugins/docker-compose /usr/local/bin/docker-compose 2>/dev/null || true
  - systemctl enable --now docker
  - sysctl -w vm.overcommit_memory=1 || true
  - iptables-legacy -P FORWARD ACCEPT 2>/dev/null || true
  # Node.js 22 on the HOST. On self-hosted runners the orb's "Install Node.js" step early-exits
  # (it expects Node pre-installed, like the Katapult VM template) and Vitest then runs via host
  # npm inside the parallel-tests step — without this, that step hangs on "npm not found".
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y -qq nodejs
  - node --version && npm --version
  # circleci user + workdir + PASSWORDLESS SUDO (job steps run as circleci and use sudo
  # chown/rm; without NOPASSWD sudo hangs forever on a hidden password prompt).
  - id circleci >/dev/null 2>&1 || useradd -m -s /bin/bash circleci
  - usermod -aG docker circleci
  - echo 'circleci ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/90-circleci-nopasswd
  - chmod 440 /etc/sudoers.d/90-circleci-nopasswd
  - mkdir -p /home/circleci/workdir && chown circleci:circleci /home/circleci/workdir
  # CircleCI machine runner
  - curl -s https://packagecloud.io/install/repositories/circleci/runner/script.deb.sh?any=true | bash
  - apt-get install -y -qq circleci-runner
  - |
    cat > /etc/circleci-runner/circleci-runner-config.yaml <<CFG
    api:
      auth_token: "${RUNNER_AUTH_TOKEN}"
    runner:
      name: "${RUNNER_NAME}"
      working_directory: "/home/circleci/workdir"
      cleanup_working_directory: false
      max_run_time: 2h
    CFG
  - chown -R circleci:circleci /home/circleci /etc/circleci-runner || true
  - systemctl enable --now circleci-runner
  # Idle self-destruct (no-op if HETZNER_SELF_TOKEN was left empty)
  - systemctl daemon-reload
  - systemctl enable --now hetzner-reaper.service
  - echo "runner bootstrap complete" > /var/log/hetzner-runner-ready
