check host iznik-routing-go with address 127.0.0.1
  depends mysql
  start program = "/bin/bash -c 'cd /var/www/iznik-routing-go; . ./.env ; nohup ./iznik-routing-go >> /tmp/iznik-routing-go.out 2>&1 &'"
  stop program = "/bin/bash -c '/bin/killall -SIGINT iznik-routing-go; sleep 10; /bin/killall -9 iznik-routing-go'"
  # iznik-routing-go rebuilds the 7.3G UK graph from pbf on EVERY start before /health responds
  # (~5 min; 282-306s observed, and variable). The restart grace MUST comfortably exceed that. With
  # the old 6 cycles x 60s = 6 min, a slightly-slow load gets restarted mid-build, which trips the
  # "restarts within cycles -> timeout" rule below and makes monit GIVE UP monitoring (after which a
  # plain `monit restart` silently no-ops - the failure we hit 2026-06-25). 15 cycles x 60s = 15 min
  # grace leaves ample headroom; the timeout rule is relaxed to match so a single slow start can't
  # cascade into give-up.
  if failed port 8196 protocol http request "/health" timeout 12 seconds for 15 cycles then restart
  if 3 restarts within 30 cycles then timeout
