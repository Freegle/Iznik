check host iznik-server-go with address 127.0.0.1
  depends mysql
  start program = "/bin/bash -c 'cd /var/www/iznik-server-go; . ./.env ; nohup ./iznik-server-go >> /tmp/iznik-server-go.out 2>&1 &'"
  stop program = "/bin/bash -c '/bin/killall -SIGINT iznik-server-go; sleep 10; /bin/killall -9 iznik-server-go'"
  # Two failed cycles, not retries: retries run back to back, so straight after a start they
  # all hit a port that is not open yet and monit restarted the API a second time.
  if failed port 8192 protocol http request "/api/group" timeout 10 seconds for 2 cycles then restart
  if 5 restarts within 5 cycles then timeout
  # Never started by monit after a reboot. monit's default (onreboot start) starts every service
  # when the machine comes back, whatever was unmonitored before, so after a data node's reboot
  # it started the API before the routing server could answer: members got 503 on every reach
  # question for half a minute (17 November 2026, 199 requests). The API comes up only when
  # freegle-maint, or a person following the runbook, starts or monitors it once routing answers.
  onreboot nostart
