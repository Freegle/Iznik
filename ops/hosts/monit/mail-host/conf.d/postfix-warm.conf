# The throttled provider lanes (Yahoo, Virgin Media) deliver from a SECOND
# postfix instance, so that a provider we are deliberately pacing cannot fill
# the primary instance's active queue and delay mail to every healthy domain.
#
# It needs its own check because nothing else watches it: the primary has its
# own master.pid and would go on looking perfectly healthy while every
# throttled provider stopped dead.
  check process postfix-warm with pidfile /var/spool/postfix-warm/pid/master.pid
    start program = "/usr/sbin/postmulti -i postfix-warm -p start"
    stop program  = "/usr/sbin/postmulti -i postfix-warm -p stop"

# The warm instance exists so a paced provider cannot pin the PRIMARY's active
# queue. One level down the same mechanism still applies: when the warm
# instance's own active queue fills, its queue manager stops importing and a
# second paced group waits behind the first. Much less serious - both are
# providers we are deliberately slowing - but the original incident lasted
# thirty hours because nobody could see it, so make this one visible.
  check program postfix-warm-active with path "/etc/monit/scripts/postfix-warm-active.sh"
    every 5 cycles
    if status != 0 then alert
