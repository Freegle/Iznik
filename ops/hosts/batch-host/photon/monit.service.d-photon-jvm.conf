[Service]
# The photon geocoder is a JVM started by monit; JVMs need W+X memory for
# the JIT, which MemoryDenyWriteExecute forbids (children inherit it) - every
# monit-spawned java failed with: Error occurred during initialization of VM.
MemoryDenyWriteExecute=false

# monit.service ships ProtectSystem=strict with
# ReadWritePaths=/run /var/lib/monit /var/log, so the whole filesystem is
# read-only to monit AND to every process it spawns. Photon's startup copies
# its Elasticsearch modules into /var/www/photon/photon_data, so under monit it
# died instantly with:
#   java.nio.file.FileSystemException: .../lang-painless/antlr4-runtime.jar:
#   Read-only file system
# and monit looped restart-fail every 2 min (2026-08-21 reboot, from 11:16).
# Starting it by hand from a root shell always worked, which is why this hid for
# so long. ReadWritePaths is a list; this appends to the shipped one.
ReadWritePaths=/var/www/photon
