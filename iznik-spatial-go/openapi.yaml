openapi: 3.0.3
info:
  title: Freegle Spatial Server
  description: |
    Multi-dataset spatial KNN and polygon query server.
    Replaces direct MySQL/PostGIS spatial queries for postcode remapping,
    message browsing, group proximity, newsfeed, jobs, and user location lookups.

    Datasets: locations, messages, newsfeed, userapproxlocs, groups, jobs.

    Admin endpoints (port 8195) are not externally exposed.
  version: "1.0.0"

servers:
  - url: http://localhost:8194
    description: Public API

paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /v1/datasets:
    get:
      summary: List all datasets with row counts and ready status
      responses:
        "200":
          description: Dataset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  datasets:
                    type: array
                    items:
                      $ref: "#/components/schemas/DatasetInfo"

  /v1/{dataset}/status:
    get:
      summary: Dataset row count and last sync time
      parameters:
        - $ref: "#/components/parameters/datasetParam"
      responses:
        "200":
          description: Dataset status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready:
                    type: boolean
                  count:
                    type: integer
                  last_sync:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/{dataset}/knn:
    get:
      summary: K-nearest spatial items
      description: |
        Returns up to `limit` items nearest to the query point.
        For polygon datasets (locations, groups, jobs) uses progressive buffer expansion.
        For point datasets (messages, newsfeed, userapproxlocs) uses Euclidean distance.

        If `polygon` is supplied, only items whose geometry intersects the polygon are returned.
        The `type` filter is only supported by the `locations` dataset. It is applied
        during buffer expansion, so the search keeps widening until a matching item
        is found. Use an exact type (e.g. `type=Postcode`) or `type=Area` for any
        non-postcode location (the V1 postcode-remap candidate pool).
      parameters:
        - $ref: "#/components/parameters/datasetParam"
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: double
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1
        - name: type
          in: query
          required: false
          description: "locations dataset only: exact type (e.g. Postcode), or Area for any non-postcode location"
          schema:
            type: string
            example: Postcode
        - name: polygon
          in: query
          required: false
          description: |
            WKT polygon restricting results to items within this geometry.
            Maximum 100 KB; maximum 10 000 vertices.
          schema:
            type: string
            example: "POLYGON((0 51, 1 51, 1 52, 0 52, 0 51))"
      responses:
        "200":
          description: KNN results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/{dataset}/within:
    get:
      summary: All items intersecting a polygon
      description: |
        Returns the external IDs of all items whose geometry intersects the supplied WKT polygon.
        Returns HTTP 413 if the result set exceeds 10 000 IDs — the caller must subdivide the polygon.

        WKT polygon constraints: max 100 KB, max 10 000 vertices.
      parameters:
        - $ref: "#/components/parameters/datasetParam"
        - name: polygon
          in: query
          required: true
          description: WKT polygon (max 100 KB, max 10 000 vertices)
          schema:
            type: string
      responses:
        "200":
          description: Matching item IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ids:
                    type: array
                    items:
                      type: integer
                      format: int64
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Polygon matches too many results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /openapi.yaml:
    get:
      summary: This OpenAPI specification
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

components:
  parameters:
    datasetParam:
      name: dataset
      in: path
      required: true
      description: "Dataset name: locations, messages, newsfeed, userapproxlocs, groups, or jobs"
      schema:
        type: string
        enum: [locations, messages, newsfeed, userapproxlocs, groups, jobs]

  schemas:
    QueryResult:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: External ID from the source table
        distance:
          type: number
          format: double
          description: Approximate distance in decimal degrees
        extra:
          type: object
          description: Dataset-specific extra fields
          additionalProperties: true
          example:
            name: "Balham"
            type: "Polygon"

    DatasetInfo:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
          format: int64
        ready:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Unknown dataset
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Dataset index not yet ready
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
