version: 2.1

setup: true

parameters:
  run_manual_promote:
    type: boolean
    default: false
    description: "Set to true to manually trigger promotion/submission workflow"
  build_testflight:
    type: boolean
    default: false
    description: "Set to true to build iOS and upload to TestFlight from current branch"
  use_katapult:
    type: boolean
    default: false
    description: "Set to true to run tests on a Katapult cloud runner"

orbs:
  continuation: circleci/continuation@2

jobs:
  check-runner:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - checkout
      - run:
          name: Cancel older redundant pipelines
          command: |
            # Dynamic config (setup: true) breaks CircleCI's built-in auto-cancel.
            # Continuation pipelines get new IDs, so CircleCI doesn't recognise them
            # as redundant. We cancel older running pipelines for the same branch manually.
            if [ -z "$CIRCLE_TOKEN" ]; then
              echo "CIRCLE_TOKEN not set — skipping"
              exit 0
            fi

            BRANCH="<< pipeline.git.branch >>"
            THIS_PIPELINE="<< pipeline.id >>"
            THIS_NUMBER="<< pipeline.number >>"
            PROJECT_SLUG="gh/Freegle/Iznik"

            echo "Current pipeline: #${THIS_NUMBER} (${THIS_PIPELINE}) on ${BRANCH}"

            # Get recent pipelines for this branch
            PIPELINES=$(curl -sf \
              -H "Circle-Token: ${CIRCLE_TOKEN}" \
              "https://circleci.com/api/v2/project/${PROJECT_SLUG}/pipeline?branch=${BRANCH}" 2>/dev/null) || true

            if [ -z "$PIPELINES" ]; then
              echo "Failed to fetch pipelines — skipping"
              exit 0
            fi

            # Find older pipelines (lower number) that are still running
            echo "$PIPELINES" | jq -r --argjson thisNum "$THIS_NUMBER" \
              '.items[] | select(.number < $thisNum and .state == "created") | .id' | while read -r PIPELINE_ID; do
              echo "Checking workflows for pipeline ${PIPELINE_ID}..."

              WORKFLOWS=$(curl -sf \
                -H "Circle-Token: ${CIRCLE_TOKEN}" \
                "https://circleci.com/api/v2/pipeline/${PIPELINE_ID}/workflow" 2>/dev/null) || continue

              echo "$WORKFLOWS" | jq -r '.items[] | select(.status == "running" or .status == "on_hold") | .id' | while read -r WF_ID; do
                echo "Cancelling workflow ${WF_ID} from older pipeline"
                curl -sf -X POST \
                  -H "Circle-Token: ${CIRCLE_TOKEN}" \
                  "https://circleci.com/api/v2/workflow/${WF_ID}/cancel" 2>/dev/null || true
              done
            done

            echo "Done checking for redundant pipelines"
      - run:
          name: Check self-hosted runner availability
          no_output_timeout: 30m
          command: |
            # For manual promote or testflight, skip runner check — those workflows
            # don't use the runner. Only pass use_self_hosted to avoid re-passing
            # trigger parameters which causes "Conflicting pipeline parameters".
            if [ "<< pipeline.parameters.run_manual_promote >>" = "true" ] || [ "<< pipeline.parameters.build_testflight >>" = "true" ]; then
              echo "Manual promote or testflight trigger — skipping runner check"
              echo "{\"use_self_hosted\": false}" > /tmp/pipeline-params.json
              cat /tmp/pipeline-params.json
              exit 0
            fi

            if [[ "<< pipeline.parameters.use_katapult >>" = "true" || "<< pipeline.git.branch >>" == test/katapult* ]]; then
              echo "Katapult preferred — checking runner availability"
              KATAPULT_TOKEN="${KATAPULT_API_TOKEN:-fl5K0qz5p68bMSPPBMH0D5MUSul0owTaCM3D4RnXgCc7Ew89}"
              KATAPULT_ORG="org_0zTGdMXAyOgIV5DB"
              KATAPULT_API="https://api.katapult.io/core/v1"
              RUNNER_API="https://runner.circleci.com/api/v3"

              katapult_online() {
                if [ -z "$CIRCLE_TOKEN" ]; then echo "0"; return; fi
                curl -sf -H "Circle-Token: $CIRCLE_TOKEN" \
                  "${RUNNER_API}/runner?resource-class=freegle/katapult-runner" 2>/dev/null \
                  | python3 -c "import json,sys,datetime; d=json.load(sys.stdin); c=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(seconds=120); print(sum(1 for r in d.get('items',[]) if r.get('resource_class')=='freegle/katapult-runner' and r.get('last_connected','') and datetime.datetime.fromisoformat(r['last_connected'].replace('Z','+00:00'))>c))" 2>/dev/null \
                  || echo "0"
              }

              ONLINE=$(katapult_online)
              echo "Katapult runners currently online: $ONLINE"

              if [ "$ONLINE" = "0" ]; then
                if [ -n "$KATAPULT_TOKEN" ]; then
                  VM_NAME="circleci-runner-$(date +%s)"
                  echo "No runner online — provisioning VM: $VM_NAME"
                  curl -sf -X POST "${KATAPULT_API}/organizations/${KATAPULT_ORG}/virtual_machines/build" \
                    -H "Authorization: Bearer $KATAPULT_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "{\"name\":\"$VM_NAME\",\"hostname\":\"$VM_NAME\",\"package\":{\"id\":\"vmpkg_7k6bXXWeEXIc17Yt\"},\"disk_template\":{\"id\":\"dtpl_GsTMRz9tpUUNkmDO\"},\"data_center\":{\"id\":\"loc_UUhPmoCbpic6UX0Y\"}}" \
                    > /dev/null && echo "Build triggered for $VM_NAME" || echo "VM provisioning API call failed"

                  # Poll VM list until named VM appears, then poll state until 'started' (up to 15 min)
                  VM_ID="" VM_STATE="" VM_IP="" VM_PASS=""
                  for i in $(seq 1 90); do
                    sleep 10
                    if [ -z "$VM_ID" ]; then
                      VM_ID=$(curl -sf -H "Authorization: Bearer $KATAPULT_TOKEN" \
                        "${KATAPULT_API}/organizations/${KATAPULT_ORG}/virtual_machines" 2>/dev/null | \
                        jq -r --arg n "$VM_NAME" '.virtual_machines[] | select(.name == $n) | .id' 2>/dev/null || echo "")
                      [ -n "$VM_ID" ] && echo "  VM appeared in list: $VM_ID"
                    fi
                    if [ -n "$VM_ID" ]; then
                      DETAIL=$(curl -sf -H "Authorization: Bearer $KATAPULT_TOKEN" \
                        "${KATAPULT_API}/virtual_machines/${VM_ID}" 2>/dev/null || echo "{}")
                      VM_STATE=$(echo "$DETAIL" | jq -r '.virtual_machine.state // ""' 2>/dev/null || echo "")
                      VM_IP=$(echo "$DETAIL" | jq -r '.virtual_machine.ip_addresses[] | select(.address | contains(":") | not) | .address' 2>/dev/null | head -1 || echo "")
                      if [ -z "$VM_PASS" ]; then
                        VM_PASS=$(echo "$DETAIL" | jq -r '.virtual_machine.initial_root_password // ""' 2>/dev/null || echo "")
                      fi
                    fi
                    echo "  [${i}/90] $VM_NAME state=${VM_STATE:-building} ip=${VM_IP:-pending}"
                    [ "$VM_STATE" = "started" ] && break
                  done

                  if [ "$VM_STATE" = "started" ] && [ -n "$VM_IP" ]; then
                    bash scripts/configure-katapult-vm.sh "$VM_IP" "$VM_PASS" "$VM_NAME" "$VM_ID" "$KATAPULT_TOKEN" \
                      || echo "WARNING: configure-katapult-vm.sh failed — runner may need manual setup"
                  else
                    echo "WARNING: VM $VM_NAME did not reach started state — skipping configuration"
                  fi

                  echo "Waiting for Katapult runner to come online (up to 5 min)..."
                  for i in $(seq 1 30); do
                    sleep 10
                    ONLINE=$(katapult_online)
                    echo "  [${i}/30] Katapult runners online: $ONLINE"
                    if [ "$ONLINE" -gt "0" ]; then
                      echo "✅ Katapult runner is online"
                      break
                    fi
                  done
                else
                  echo "KATAPULT_API_TOKEN not set — cannot provision VM"
                fi
              else
                echo "✅ Katapult runner already online"
              fi

              if [ "$ONLINE" -gt "0" ]; then
                echo "{\"use_self_hosted\": false, \"use_katapult\": true}" > /tmp/pipeline-params.json
                cat /tmp/pipeline-params.json
                exit 0
              fi

              echo "⚠️  No Katapult runner available — falling back to local runner check"
              # Fall through to local/cloud runner check below
            fi

            # Query CircleCI runner API to see if our self-hosted runner is online
            # Uses CIRCLE_TOKEN (project env var — personal API token) for runner API auth
            RUNNER_AVAILABLE=false

            if [ -n "$CIRCLE_TOKEN" ]; then
              echo "Checking for online runners in freegle/circleci-docker-runner..."
              RESPONSE=$(curl -sf --retry 2 --retry-delay 3 \
                -H "Circle-Token: ${CIRCLE_TOKEN}" \
                "https://runner.circleci.com/api/v3/runner?resource-class=freegle/circleci-docker-runner" 2>/dev/null) || true

              if [ -n "$RESPONSE" ]; then
                ONLINE_COUNT=$(echo "$RESPONSE" | jq '[.items[] | select(.resource_class=="freegle/circleci-docker-runner")] | length' 2>/dev/null) || ONLINE_COUNT=0
                echo "Found ${ONLINE_COUNT} runner(s)"
                if [ "$ONLINE_COUNT" -gt "0" ]; then
                  RUNNER_AVAILABLE=true
                fi
              else
                echo "Runner API check failed or returned empty response — falling back to cloud"
              fi
            else
              echo "CIRCLE_TOKEN not set — falling back to cloud"
            fi

            echo "Runner available: ${RUNNER_AVAILABLE}"
            echo "{\"use_self_hosted\": ${RUNNER_AVAILABLE}}" > /tmp/pipeline-params.json
            cat /tmp/pipeline-params.json
      - run:
          name: Mark CI as running on PR
          when: always
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then
              echo "Not a PR build or GITHUB_TOKEN not set — skipping label"
              exit 0
            fi
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then exit 0; fi
            REPO="Freegle/Iznik"
            # Remove old CI result labels (URL-encoded: "CI: Passed" = CI%3A%20Passed)
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Passed" 2>/dev/null || true
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Failed" 2>/dev/null || true
            # Add CI: Running
            curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"labels":["CI: Running"]}' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
            echo "Labelled PR #$PR_NUMBER as CI: Running"
      - continuation/continue:
          configuration_path: .circleci/continue-config.yml
          parameters: /tmp/pipeline-params.json

workflows:
  setup:
    jobs:
      - check-runner
