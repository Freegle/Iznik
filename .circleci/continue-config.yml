version: 2.1

parameters:
  use_self_hosted:
    type: boolean
    default: false
    description: "Set by setup workflow — true when self-hosted runner is online"
  run_manual_promote:
    type: boolean
    default: false
    description: "Set to true to manually trigger promotion/submission workflow"
  build_testflight:
    type: boolean
    default: false
    description: "Set to true to build iOS and upload to TestFlight from current branch"

orbs:
  freegle: freegle/tests@1.1.252

jobs:
  mark-ci-passed:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mark PR as CI passed
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then exit 0; fi
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then exit 0; fi
            REPO="Freegle/Iznik"
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Running" 2>/dev/null || true
            curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"labels":["CI: Passed"]}' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
            echo "Labelled PR #$PR_NUMBER as CI: Passed"

workflows:
  version: 2

  # Main test workflow — runs on all branches
  # Uses self-hosted runner when available, cloud otherwise
  # Android debug builds run after tests pass so they don't compete for the runner
  build-test-local:
    when:
      and:
        - << pipeline.parameters.use_self_hosted >>
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
    jobs:
      - freegle/build-and-test:
          use-executor:
            name: freegle/machine-executor-local
          filters:
            branches:
              ignore:
                - modtools
      - mark-ci-passed:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - modtools
      - freegle/build-android-dev:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-modtools-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              only:
                - feat/modtools-capacitor-app

  build-test-cloud:
    when:
      and:
        - not: << pipeline.parameters.use_self_hosted >>
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
    jobs:
      - freegle/build-and-test:
          filters:
            branches:
              ignore:
                - modtools
      - mark-ci-passed:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - modtools
      - freegle/build-android-dev:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-modtools-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              only:
                - feat/modtools-capacitor-app

  # Deploy apps when production branch is pushed
  deploy-apps:
    when:
      and:
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
    jobs:
      - freegle/increment-version:
          filters:
            branches:
              only:
                - production
      - freegle/build-android:
          requires:
            - freegle/increment-version
          filters:
            branches:
              only:
                - production
      - freegle/build-ios:
          requires:
            - freegle/increment-version
          filters:
            branches:
              only:
                - production
      - freegle/check-hotfix-promote:
          requires:
            - freegle/build-android
            - freegle/build-ios
          filters:
            branches:
              only:
                - production

  # Manual promotion trigger
  manual-promote-submit:
    when: << pipeline.parameters.run_manual_promote >>
    jobs:
      - freegle/auto-promote-production:
          filters:
            branches:
              only:
                - production
      - freegle/auto-submit-ios:
          filters:
            branches:
              only:
                - production
      - freegle/auto-release-ios:
          filters:
            branches:
              only:
                - production

  # Build iOS for TestFlight from any branch
  testflight-branch:
    when: << pipeline.parameters.build_testflight >>
    jobs:
      - freegle/build-ios-testflight
