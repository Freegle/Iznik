version: 2.1

parameters:
  use_self_hosted:
    type: boolean
    default: false
    description: "Set by setup workflow — true when self-hosted runner is online"
  run_manual_promote:
    type: boolean
    default: false
    description: "Forwarded from trigger — true when run_manual_promote was set"
  build_testflight:
    type: boolean
    default: false
    description: "Forwarded from trigger — true when build_testflight was set"
  use_katapult:
    type: boolean
    default: false
    description: "Set to true to run tests on a Katapult cloud runner (freegle/katapult-runner)"
  build_modtools_production:
    type: boolean
    default: false
    description: "Forwarded from trigger — true when build_modtools_production was set"

orbs:
  # 1.1.373 drops the ORM migration inventory ratchet (Gate 1) and the Go/PHP
  # toolchain provisioning it needed. The Go migration is done - raw is at 0 -
  # so the gate was regenerating a 5,974-entry inventory on every build to
  # answer one question, "did someone add raw SQL back", which
  # .claude/check-raw-sql.sh now answers at the point it happens.
  #
  # Publishing the orb is what makes a step take effect - CircleCI resolves
  # freegle/tests from the registry, not from the copy in this repo - but the
  # PIN here decides which published version runs. Leaving master on 1.1.370
  # would not have broken anything (that step self-guarded on ci-ratchet.sh
  # existing, so it would exit 0 once this merges) - it would just have kept
  # provisioning a toolchain for a gate that no longer runs.
  #
  # 1.1.374 caches the Gradle distribution in build-android. Every Android build
  # was fetching gradle-8.11.1-all.zip (~200MB) from services.gradle.org, so a
  # release only shipped if that host held the connection for the whole
  # download. Pipeline #10729 on production 4140acbb3 lost it to
  # "java.net.SocketException: Connection reset", which failed bundleRelease and
  # left that commit with an iOS build but no Play beta artifact.
  #
  # 1.1.375 makes that cache warm on the FIRST release rather than the second.
  # build-android runs only on production and is the only writer of the
  # gradle-dist key, so a restore keyed on it alone misses on the next release
  # and downloads anyway; it now also falls back to the gradle-deps cache that
  # build-android-debug/-dev keep warm from master, which already contains the
  # unpacked distribution.
  freegle: freegle/tests@1.1.375

jobs:
  mark-ci-passed:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Mark PR as CI passed
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then exit 0; fi
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then exit 0; fi
            REPO="Freegle/Iznik"
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Running" 2>/dev/null || true
            curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Failed" 2>/dev/null || true
            curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"labels":["CI: Passed"]}' \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
            echo "Labelled PR #$PR_NUMBER as CI: Passed"

workflows:
  version: 2

  # Main test workflow — runs on all branches
  # Uses self-hosted runner when available, cloud otherwise
  # Android debug builds run after tests pass so they don't compete for the runner
  build-test-local:
    when:
      and:
        - << pipeline.parameters.use_self_hosted >>
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
        - not: << pipeline.parameters.build_modtools_production >>
    jobs:
      - freegle/build-and-test:
          use-executor:
            name: freegle/machine-executor-local
          post-steps:
            - run:
                name: Mark PR as CI failed
                when: on_fail
                command: |
                  if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then exit 0; fi
                  PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
                  if [ -z "$PR_NUMBER" ]; then exit 0; fi
                  REPO="Freegle/Iznik"
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Passed" 2>/dev/null || true
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Running" 2>/dev/null || true
                  curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"labels":["CI: Failed"]}' \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
                  echo "Labelled PR #$PR_NUMBER as CI: Failed"
          filters:
            branches:
              ignore:
                - modtools
                - production
      - mark-ci-passed:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - modtools
                - production
      - freegle/build-android-dev:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-modtools-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              only:
                - master

  build-test-cloud:
    when:
      and:
        - not: << pipeline.parameters.use_self_hosted >>
        - not: << pipeline.parameters.use_katapult >>
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
        - not: << pipeline.parameters.build_modtools_production >>
    jobs:
      - freegle/build-and-test:
          post-steps:
            - run:
                name: Mark PR as CI failed
                when: on_fail
                command: |
                  if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then exit 0; fi
                  PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
                  if [ -z "$PR_NUMBER" ]; then exit 0; fi
                  REPO="Freegle/Iznik"
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Passed" 2>/dev/null || true
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Running" 2>/dev/null || true
                  curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"labels":["CI: Failed"]}' \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
                  echo "Labelled PR #$PR_NUMBER as CI: Failed"
          filters:
            branches:
              ignore:
                - modtools
                - production
      - mark-ci-passed:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - modtools
                - production
      - freegle/build-android-dev:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - production
                - modtools
      - freegle/build-android-modtools-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              only:
                - master

  # Deploy apps when production branch is pushed — Freegle app only.
  # ModTools is published separately via the manual modtools-production workflow.
  deploy-apps:
    when:
      and:
        - not: << pipeline.parameters.run_manual_promote >>
        - not: << pipeline.parameters.build_testflight >>
        - not: << pipeline.parameters.build_modtools_production >>
    jobs:
      - freegle/increment-version:
          filters:
            branches:
              only:
                - production
      - freegle/build-android:
          requires:
            - freegle/increment-version
          filters:
            branches:
              only:
                - production
      - freegle/build-ios:
          requires:
            - freegle/increment-version
          filters:
            branches:
              only:
                - production
      - freegle/check-hotfix-promote:
          requires:
            - freegle/build-android
            - freegle/build-ios
          filters:
            branches:
              only:
                - production

  # ModTools production build and Play Store / TestFlight upload. Unlike FD, ModTools has
  # NO per-push beta builds - this workflow is the only thing that builds it, and the
  # Android side uploads straight to the Play production track.
  # Runs weekly via the CircleCI scheduled pipeline "weekly-modtools-release-schedule"
  # (Wednesday 20:00 UTC, parameters build_modtools_production: true, branch production),
  # deliberately TWO HOURS BEFORE the FD "weekly-promote-schedule" (22:00): the inline
  # submit below usually fires before Apple has processed the fresh build and exits
  # gracefully, and it is the promote workflow's auto-submit-ios-modtools that then
  # submits it the same night once processed. Can also be triggered manually by setting
  # build_modtools_production: true in the pipeline parameters UI.
  modtools-production:
    when: << pipeline.parameters.build_modtools_production >>
    jobs:
      - freegle/increment-version-modtools
      - freegle/build-android-modtools:
          requires:
            - freegle/increment-version-modtools
      - freegle/build-ios-modtools:
          requires:
            - freegle/increment-version-modtools
      - freegle/auto-submit-ios-modtools:
          requires:
            - freegle/build-ios-modtools

  # Manual promotion trigger
  manual-promote-submit:
    when: << pipeline.parameters.run_manual_promote >>
    jobs:
      - freegle/auto-promote-production:
          filters:
            branches:
              only:
                - production
      - freegle/auto-release-ios:
          filters:
            branches:
              only:
                - production
      # MUST follow auto-release-ios. Only one version can sit in the App Store
      # submission pipeline at a time, and auto-submit refuses to run (by
      # design, so a stall is never silent) while a version is
      # PENDING_DEVELOPER_RELEASE. Run in parallel these two race: on
      # 2026-08-05 auto-submit-ios failed at 22:07:33 on blocking version
      # 100.0.873, which auto-release-ios then released successfully at
      # 22:09:43 — the blocker was cleared two minutes after the job that
      # tripped over it gave up.
      - freegle/auto-submit-ios:
          requires:
            - freegle/auto-release-ios
          filters:
            branches:
              only:
                - production
      - freegle/auto-submit-ios-modtools:
          filters:
            branches:
              only:
                - production
      # ACTIVATION (do together, after this merges to master):
      #   1. Publish the orb from master so freegle/check-release-divergence exists:
      #        source .env && ~/.local/bin/circleci orb publish .circleci/orb/freegle-tests.yml freegle/tests@<next>
      #   2. Bump the `freegle: freegle/tests@…` pin above to that new version.
      #   3. Uncomment the job below.
      # Referencing an unpublished orb job in this ACTIVE workflow would fail the whole
      # promote, so it stays commented until the orb version that defines it is pinned.
      # - freegle/check-release-divergence:
      #     filters:
      #       branches:
      #         only:
      #           - production

  # Katapult cloud runner test — the default CI path (check-runner sets use_katapult=true
  # for all normal pushes). Branch filters here must match build-test-local/build-test-cloud
  # so production and modtools are skipped (they use deploy-apps and have no tests to run).
  build-test-katapult:
    when: << pipeline.parameters.use_katapult >>
    jobs:
      - freegle/build-and-test:
          use-executor:
            name: freegle/machine-executor-katapult
          post-steps:
            - run:
                name: Regenerate doc screenshots (best effort)
                when: on_success
                no_output_timeout: 15m
                command: |
                  # Generate doc screenshots inside the seeded -playwright container,
                  # copy them to the git top-level, and auto-commit meaningful changes
                  # with [skip ci] so it never triggers a new pipeline. Best-effort.
                  set +e
                  PROJ="${COMPOSE_PROJECT_NAME:-freegle}"
                  ROOT="$(git rev-parse --show-toplevel)"
                  cd "$ROOT" || exit 0
                  # The auto-merge-to-production step leaves git on the production
                  # branch; reset to this pipeline's commit so screenshots are
                  # committed onto master, not production.
                  git checkout -f "${CIRCLE_SHA1:-HEAD}" 2>/dev/null || echo "checkout to CIRCLE_SHA1 failed"
                  if ! docker ps --format '{{.Names}}' | grep -q "^${PROJ}-playwright$"; then
                    echo "playwright container not up at post-step; skipping screenshots"
                    exit 0
                  fi
                  docker exec -e DOCS_OUT=/tmp/docshots "${PROJ}-playwright" \
                    sh -c 'cd /app && export NODE_PATH="$(npm root 2>/dev/null):$(npm root -g 2>/dev/null)"; echo "NODE_PATH=$NODE_PATH"; node tests/e2e/docs-screenshots.mjs' \
                    || echo "generator non-zero (partial shots ok)"
                  echo "--- container output tree ---"; docker exec "${PROJ}-playwright" sh -c 'ls -R /tmp/docshots 2>/dev/null' | head -40
                  for aud in members moderators; do
                    mkdir -p "$ROOT/docs/$aud/assets"
                    docker cp "${PROJ}-playwright:/tmp/docshots/$aud/assets/." "$ROOT/docs/$aud/assets/" 2>&1 | head -3 || true
                  done
                  echo "--- runner assets after cp ---"; ls -la "$ROOT/docs/members/assets" "$ROOT/docs/moderators/assets" 2>&1 | head -30
                  echo "--- git status docs ---"; git status --short docs/ | head -30
                  mkdir -p ~/artifacts/doc-screenshots
                  cp -r "$ROOT/docs/members/assets" "$ROOT/docs/moderators/assets" ~/artifacts/doc-screenshots/ 2>/dev/null || true
                  if ! command -v compare >/dev/null 2>&1; then
                    sudo apt-get update -qq >/dev/null 2>&1 && sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || echo "imagemagick unavailable (will commit all changes)"
                  fi
                  # Only commit + push the regenerated screenshots on master. On a PR
                  # branch the shots are still generated and uploaded as CI artifacts
                  # (store_artifacts below) for review, but NOT committed to the branch:
                  # pushing a "docs: regenerate screenshots" commit onto a PR branch emails
                  # the PR author a GitHub notification on every run, which is pure noise.
                  # Screenshots stay current because master regenerates them on its own
                  # build after merge; the docs-freshness gate ignores the assets dir.
                  if [ "${CIRCLE_BRANCH:-}" = "master" ]; then
                    DOCS_ALLOW_MASTER=1 bash docs/screenshots/regenerate-and-commit.sh --commit-only || echo "commit step non-fatal"
                  else
                    echo "PR branch (${CIRCLE_BRANCH:-unknown}): screenshots uploaded as artifacts only, not committed to the branch."
                  fi
                  exit 0
            - store_artifacts:
                path: ~/artifacts/doc-screenshots
                destination: doc-screenshots
            - run:
                name: Mark PR as CI failed
                when: on_fail
                command: |
                  if [ -z "$CIRCLE_PULL_REQUEST" ] || [ -z "$GITHUB_TOKEN" ]; then exit 0; fi
                  PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
                  if [ -z "$PR_NUMBER" ]; then exit 0; fi
                  REPO="Freegle/Iznik"
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Passed" 2>/dev/null || true
                  curl -sf -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels/CI%3A%20Running" 2>/dev/null || true
                  curl -sf -X POST -H "Authorization: token $GITHUB_TOKEN" \
                    -H "Content-Type: application/json" \
                    -d '{"labels":["CI: Failed"]}' \
                    "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" 2>/dev/null || true
                  echo "Labelled PR #$PR_NUMBER as CI: Failed"
          filters:
            branches:
              ignore:
                - modtools
                - production
      - mark-ci-passed:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              ignore:
                - modtools
      - freegle/build-android-modtools-debug:
          requires:
            - freegle/build-and-test
          filters:
            branches:
              only:
                - master

  # Build iOS for TestFlight from any branch
  testflight-branch:
    when: << pipeline.parameters.build_testflight >>
    jobs:
      - freegle/build-ios-testflight
