[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-scheduler]
process_name=%(program_name)s
# schedule:work runs schedule:run aligned to each clock minute and never drifts.
# The previous "while true; schedule:run; sleep 60" loop accumulated ~1s/minute of
# drift (schedule:run dispatch time + a flat 60s sleep), so roughly once an hour the
# loop straddled a minute boundary and skipped a whole clock minute. Any job pinned to
# an exact ->dailyAt('HH:MM') minute could then silently never fire — e.g. on
# 2026-06-18 the 02:30 minute was dropped and stats:generate-daily never ran.
command=php /var/www/html/artisan schedule:work --no-interaction
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:mail-spooler]
process_name=%(program_name)s
command=php /var/www/html/artisan mail:spool:process --daemon --limit=100
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/spooler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60

[program:mail-receiver]
process_name=%(program_name)s
command=php -S 0.0.0.0:8080 -t /var/www/html/public /var/www/html/public/index.php
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/mail-receiver.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=10
