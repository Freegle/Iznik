[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-scheduler]
process_name=%(program_name)s
# schedule:work runs schedule:run aligned to each clock minute and never drifts.
# The previous "while true; schedule:run; sleep 60" loop accumulated ~1s/minute of
# drift (schedule:run dispatch time + a flat 60s sleep), so roughly once an hour the
# loop straddled a minute boundary and skipped a whole clock minute. Any job pinned to
# an exact ->dailyAt('HH:MM') minute could then silently never fire — e.g. on
# 2026-06-18 the 02:30 minute was dropped and stats:generate-daily never ran.
command=php /var/www/html/artisan schedule:work --no-interaction
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=root
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:mail-spooler]
# numprocs>1 REQUIRES %(process_num)s in process_name - supervisord raises
# ValueError at config-parse time otherwise, and it is PID 1 here, so the whole
# batch container would crash-loop and take the scheduler, both queue workers
# and the mail-receiver on :8080 down with it. These four settings are one
# atomic change: numprocs without process_num kills the container, and
# process_num without --worker gives the workers a SHARED sending/ dir, which
# is the duplicate-send hazard worker scoping exists to prevent.
#
# Delivery is latency-bound, not CPU-bound (measured: 15.9% of one core, ~150ms
# per message dominated by the SMTP round-trip), so it parallelises - but the
# ceiling is what the smarthost can absorb, not what we can push. Start at 2.
# Before going higher, confirm bulk2's load and deferred queue stay flat.
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan mail:spool:process --daemon --limit=100 --worker=%(process_num)02d
autostart=true
autorestart=true
user=root
numprocs=2
redirect_stderr=true
# Per-process log: supervisor rotates by rename+reopen per process, so several
# processes sharing one path lose lines into the rotated inode.
stdout_logfile=/var/www/html/storage/logs/spooler_%(process_num)02d.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=60

[program:mail-receiver]
process_name=%(program_name)s
command=php -S 0.0.0.0:8080 -t /var/www/html/public /var/www/html/public/index.php
autostart=true
autorestart=true
user=root
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/mail-receiver.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=10
