; Opcache for the command line. The image's php.ini only enables opcache for
; web SAPIs, so every artisan run and every PHPUnit test boot was parsing and
; compiling bootstrap/app.php, the config files and the route files afresh,
; and a spawned php process compiled the whole framework from scratch.
opcache.enable_cli=1
; The tree is bind-mounted in development and edited between runs, so a
; changed file must be noticed on the next include, not after a grace period.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
; Room for the framework, the app and the test suite in one process.
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
; No JIT: pcov collects coverage from the opcodes as compiled, and the JIT has
; nothing to offer a short-lived process.
opcache.jit=off
opcache.jit_buffer_size=0
; One thing to know: while opcache compiles a file it detaches the user error
; handler, so a compile-time deprecation (such as PHP 8.4's "implicitly marking
; parameter as nullable") is printed through display_errors instead of being
; handed to Laravel's handler. In a PHPUnit test that runs in its own process
; that print is treated as test output and fails the test with the deprecation
; as its message. The fix is to fix the deprecation it names.
; Compiled scripts are also kept on disk. A process that lives for one command
; (a cron'd artisan run, or a PHPUnit test that runs in its own process) gets
; nothing from the in-memory cache, which starts empty with each process and
; costs more to fill than compiling does: booting the application in a fresh
; process measured 220ms with no opcache, 440ms with the memory cache alone,
; and 145ms reading from a warm file cache. The directory is validated the
; same way as the memory cache, by the source file's timestamp.
opcache.file_cache=/tmp/opcache-file-cache
