name: Build Batch Base Image

on:
  push:
    paths:
      - 'iznik-batch/docker/Dockerfile.base'
    branches:
      - master
  schedule:
    # Monthly rebuild on 1st of each month at 4am UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./iznik-batch
          file: ./iznik-batch/docker/Dockerfile.base
          push: true
          tags: |
            ghcr.io/freegle/freegle-batch-base:latest
            ghcr.io/freegle/freegle-batch-base:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
