# docker-compose.override.edge.yml — PROD-DOCKER-HOST-ONLY override for the
# `edge` profile (scale-in-place, decided 2026-07-08 — see the REVISION in
# plans/2026-06-25-frontend-server-migration.md).
#
# Opt in ONLY on the existing prod docker/batch host by adding this file to
# COMPOSE_FILE in its .env, alongside the auto-loaded batch-prod override:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml:docker-compose.override.edge.yml
#   COMPOSE_PROFILES=backend,production,mail,edge
#
# It is NEVER part of the default COMPOSE_FILE, so local dev and CI are
# unaffected.
#
# STAGE 1 (adopt-now — plan §2 step 2): bring the standalone tile + wiki
# containers under Compose in place (same host, same data, zero copy) and drop
# ors-app + the stale discourse vhost. The host-specific bits the base file
# deliberately omits live here:
#   1. tile-server / wiki-media republish the SAME host ports the standalone
#      containers used (:8080 / :8088) so the native nginx vhosts that front
#      tiles/wiki are untouched — a same-port container swap. (Native nginx
#      keeps :80/:443 with its certbot TLS for tiles/geocode/wiki.)
#   2. tile-server / wiki-* adopt the host's EXISTING data (the unprefixed osm
#      volumes used by confident_curran + the /var/wiki binds) instead of
#      creating empty project-scoped volumes and serving nothing.
#   3. The images tier (frontend-nginx / delivery / tusd) runs here
#      since 2026-07-08. Uploads go to a local spool and on to object storage;
#      the NFS share is read-only for the legacy copy - see
#      docs/ops/runbooks/images-to-object-storage.md.

services:
  # --- Stage 1: adopted services, come UP on this host ----------------------
  # restart: unless-stopped — the standalone containers ran restart:always; on
  # this always-on host we want Docker to bring them back after a crash/OOM,
  # not only via freegle-docker.service on reboot (mirrors the spatial services
  # in docker-compose.override.yml). Base compose leaves them restart:"no".
  tile-server:
    # Native nginx `maps` vhost fronts tiles.ilovefreegle.org via 127.0.0.1:8080
    # (unchanged), so the adopted container republishes :8080 exactly like the
    # standalone confident_curran did. Swap: free :8080 (stop confident_curran)
    # then start this.
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Cap renderd render threads. confident_curran ran THREADS=100 as a
      # near-dedicated tile host; on THIS shared 8-core box (batch/spatial/wiki
      # co-resident) 100 render threads saturate CPU on every replication cycle
      # (renderd "Failed to send render cmd", growing expiry backlog, load 100+).
      # Serving already-rendered tiles is unaffected (they come from the
      # osm-tiles volume); this only bounds the background re-render concurrency.
      # cgroup: tile-server is in the default slice (weight 100) — it yields to
      # interactive image serving (800) and outranks batch (25).
      - THREADS=4

  spatial-knn:
    # Native nginx `geocode` vhost fronts geocode.ilovefreegle.org; its
    # proxy_pass target moves from Photon (127.0.0.1:2322) to the places /api
    # here (see docs/ops/runbooks/geocoder-cutover.md). Loopback only, like
    # Photon was. This host's COMPOSE_FILE does not include
    # docker-compose.ports.yml, so the port is published here.
    ports:
      - "127.0.0.1:${PORT_SPATIAL_KNN:-8198}:8194"

  wiki-mysql:
    # Adopt the already-initialised DB datadir in place (zero copy).
    restart: unless-stopped
    volumes:
      - /var/wiki/db:/var/lib/mysql
      - /var/wiki/sharemysql:/var/sharemysql

  wiki-media:
    # Native nginx fronts wiki.ilovefreegle.org via 127.0.0.1:8088 (unchanged).
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - /var/wiki/html:/var/www/html
      - /var/wiki/sharewiki:/var/www/share

  # --- Images tier (plan §3) — brought UP 2026-07-08 for validation + cache
  # warming on the new ports (:8180/:8188). NOT yet fronting live traffic: the
  # HAProxy cutover on ha-internal (repoint tusd_backend, add delivery_backend)
  # is the separate human-gated step. Until then these serve only Host-header
  # test curls and the low-priority cache rsync; no user reaches them.
  #
  # cgroup_parent: interactive.slice — latency-sensitive user serving, same
  # priority tier as embedding-sidecar (CPUWeight=800). Requires the slice
  # units from PR #1006 installed (they are). The digest job (07:00-12:00,
  # batch.slice weight 25) *causes* the edge image peak, so this weighting is
  # what lets image serving win under that exact contention.
  frontend-nginx:
    deploy:
      replicas: 1
    cgroup_parent: interactive.slice
    ports:
      - "8180:80"     # HAProxy reaches this with send-proxy (PROXY protocol)
      - "8188:8080"   # plain — the :8080 upload-URL form (apps/Freebie Alerts)
    environment:
      # The base default is the dev objectstore, which would 502 here. Refuse
      # to start without the real public bucket URL (trailing slash) in .env.
      - IMAGE_STORE_PUBLIC_URL=${IMAGE_STORE_PUBLIC_URL:?set IMAGE_STORE_PUBLIC_URL in .env to the public base URL of the image bucket}
    volumes:
      # The legacy share, read-only, served as static files for any GET the
      # spool and the bucket both 404. Drop this bind, the nginx hop and the
      # batch-prod bind below once images:migrate-legacy --verify is clean.
      - /srv/tusd-data:/images:ro

  delivery:
    deploy:
      replicas: 1
    cgroup_parent: interactive.slice
    # Production SSRF protection: replace the base's empty dev deny file with the full private-range
    # deny list so the public image proxy cannot be pointed at internal hosts. (All base volumes are
    # re-listed because compose merges by mount target, and this must win at that path.)
    volumes:
      - ./delivery-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./delivery-imagesweserv.conf:/etc/nginx/imagesweserv.conf:ro
      - ./delivery-weserv-deny-private.edge.conf:/etc/nginx/weserv-deny-private.conf:ro

  tusd:
    deploy:
      replicas: 1
    cgroup_parent: interactive.slice
    # Pin to app1's EXACT prod version. Base compose uses tusproject/tusd:latest
    # (v2.10.0), which on the shared NFS 500d with "open /images/<id>.lock:
    # permission denied" serving existing uploads (2026-07-08 cutover), while
    # v2.4.0 served them reliably. NB v2.4.0 ALSO creates <id>.lock on GET
    # (seen 2026-09-28 against a read-only mount), so the difference was the
    # lock write being refused, not locking itself; the pin stays until an
    # upgrade is tested on the spool. Uploads no longer touch NFS at all.
    image: tusproject/tusd:v2.4.0
    # Prod flags as app1 ran them (-behind-proxy, -base-path /, -disable-cors:
    # all tus CORS from HAProxy; NO -hooks-http), except that uploads now land
    # in the LOCAL spool volume, not on the NFS share. images:push-spool in
    # batch-prod moves each completed upload to the object store within a
    # minute or two; until then frontend-nginx serves it from here. See
    # plans/active/2026-09-28-images-to-object-storage.md and the runbook
    # docs/ops/runbooks/images-to-object-storage.md.
    #
    # /srv/tusd-data is the image's own upload directory, which is what makes
    # the spool volume writable by tusd (see the base compose). The .info
    # never leaves the host; only the bytes go to the bucket.
    command: -upload-dir=/srv/tusd-data -behind-proxy -base-path / -disable-cors
    # Base healthcheck probes /tus/ (the dev base-path); prod base-path is /,
    # where tusd returns 405 for GET and 404 at /tus/. Probe / and accept 405.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ 2>&1 | grep -E '(200|405)' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    # No NFS bind any more: the base compose mounts the tusd-spool volume at
    # /srv/tusd-data INSIDE the container (the host directory of the same name
    # is the NFS mount - unrelated, and no longer given to tusd). The share
    # stays mounted on the host for frontend-nginx and batch-prod below,
    # read-only, until the legacy copy is verified complete.

  # The dev stand-in for the bucket has no place on the prod host.
  objectstore:
    deploy:
      replicas: 0
  objectstore-init:
    deploy:
      replicas: 0

  batch-prod:
    volumes:
      # The legacy share, read-only, for images:migrate-legacy. It reads files by
      # name only and never lists the directory.
      - /srv/tusd-data:/images:ro

volumes:
  # Adopt the host's existing unprefixed volumes (created by confident_curran)
  # via `name:` rather than `external: true` — the base file declares these with
  # `driver: local`, and external+driver is a hard conflict. The benign "not
  # created by Compose" warning is the accepted cost of the in-place adoption.
  osm-data:
    name: osm-data
  osm-tiles:
    name: osm-tiles
