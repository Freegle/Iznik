services:
  # Base image - must be built first, all other containers depend on it
  base:
    image: freegle-base:latest
    build:
      context: .
      dockerfile: Dockerfile.base
    command: ["true"]  # Exits immediately, just used for building
    profiles:
      - build  # Only runs when explicitly requested or as dependency

  reverse-proxy:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-traefik
    profiles:
      - dev
    networks:
      default:
        aliases:
          - apiv2.localhost
          - apiv2-live.localhost
          - freegle-dev-local.localhost
          - freegle-dev-live.localhost
          - freegle-prod-local.localhost
          - modtools-dev-local.localhost
          - modtools-dev-live.localhost
          - modtools-prod-local.localhost
          - status.localhost
          - ai-support-helper.localhost
          - delivery.localhost
          - tusd.localhost
    image: traefik:latest
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.constraints=Label(`com.docker.compose.project`,`${COMPOSE_PROJECT_NAME:-freegle}`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.encodedcharacters.allowencodedslash=true"
      - "--entrypoints.api.address=:8192"
      - "--entrypoints.api.http.encodedcharacters.allowencodedslash=true"
      - "--entrypoints.traefik.address=:8080"
      - "--accesslog=true"
      - "--accesslog.fields.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=keep"
      - "--log.level=DEBUG"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
      # Increase transport settings for parallel requests
      - "--serversTransport.maxIdleConnsPerHost=200"
    ports:
      - "${PORT_TRAEFIK_HTTP:-80}:80"
      - "${PORT_TRAEFIK_API:-8192}:8192"
      - "${PORT_TRAEFIK_DASHBOARD:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/dashboard/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  percona:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-percona
    profiles:
      - database
    networks:
      - default
    image: percona:8.0.43-34
    restart: always
    volumes:
      - freegle_db:/var/lib/mysql
      - ./conf/percona-my.cnf:/etc/my.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: iznik
      MYSQL_DATABASE: iznik
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  postgres:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-postgres
    profiles:
      - database
    networks:
      - default
    image: postgis/postgis:13-3.1
    restart: "no"
    environment:
      POSTGRES_DB: iznik
      POSTGRES_PASSWORD: iznik
      POSTGRES_USER: root
    healthcheck:
      test: ["CMD-SHELL", "psql -h localhost -U root -d iznik -c 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  phpmyadmin:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-phpmyadmin
    profiles:
      - dev
    networks:
      - default
    image: phpmyadmin
    ports:
      - "0.0.0.0:${PORT_PHPMYADMIN:-8086}:80"
    depends_on:
      percona:
        condition: service_started
        required: false
      reverse-proxy:
        condition: service_started
    restart: "no"
    environment:
      - PMA_HOST=percona
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_PRODUCTION_ROOT_PASSWORD:-iznik}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.localhost`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-mailpit
    profiles:
      - dev
    networks:
      - default
    ports:
      - "0.0.0.0:${PORT_MAILPIT_WEB:-8025}:8025"
      - "0.0.0.0:${PORT_MAILPIT_SMTP:-1025}:1025"
    depends_on:
      percona:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      beanstalkd:
        condition: service_healthy
        required: false
      spamassassin-app:
        condition: service_started
      rspamd:
        condition: service_healthy
      reverse-proxy:
        condition: service_healthy
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
      - MP_ENABLE_SPAMASSASSIN=spamassassin-app:783
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`mailpit.localhost`)"
      - "traefik.http.routers.mailpit.entrypoints=web"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  beanstalkd:
    image: schickling/beanstalkd
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-beanstalkd
    profiles:
      - frontend
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 11300 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  spamassassin-app:
    image: instantlinux/spamassassin
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-spamassassin
    profiles:
      - backend
      - dev
    networks:
      - default
    ports:
      - ${PORT_SPAMASSASSIN:-783}:783
    volumes:
      - ./logs/spamassassin:/var/log
      - ./conf:/etc/mail/spamassassin
      - ./data:/data
      - spamassassin_home:/var/lib/spamassassin
    environment:
      - CONTAINER_NAME=spamassassin-app
    restart: "no"

  rspamd:
    image: rspamd/rspamd:latest
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-rspamd
    profiles:
      - backend
      - dev
    networks:
      - default
    ports:
      - "${PORT_RSPAMD:-11334}:11334"
    volumes:
      - ./conf/rspamd/local.d:/etc/rspamd/local.d:ro
      - rspamd_data:/var/lib/rspamd
    depends_on:
      redis:
        condition: service_healthy
        required: false
    environment:
      - REDIS_SERVERS=redis:6379
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "rspamadm control stat > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rspamd.rule=Host(`rspamd.localhost`)"
      - "traefik.http.routers.rspamd.entrypoints=web"
      - "traefik.http.services.rspamd.loadbalancer.server.port=11334"

  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-redis
    profiles:
      - backend
      - frontend
    networks:
      - default
    image: redis:6.2-alpine
    restart: "no"
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # MJML email template compilation server (used by batch for worker pool back pressure)
  # API: POST raw MJML text to / with Content-Type: text/plain, returns compiled HTML
  mjml:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-mjml
    profiles:
      - backend
    networks:
      - default
    image: adrianrudnik/mjml-server:latest
    restart: "no"
    healthcheck:
      # Server has no dedicated health endpoint; use TCP check on port 80
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  delivery:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-delivery
    profiles:
      - frontend
      - edge   # front-end host: weserv replaces the external wsrv.nl dependency
    networks:
      - default
    image: ghcr.io/weserv/images:5.x
    restart: "no"
    shm_size: 1gb
    depends_on:
      tusd:
        condition: service_started
      freegle-prod-local:
        condition: service_started
        required: false
      modtools-prod-local:
        condition: service_started
        required: false
    extra_hosts:
      - "tusd.localhost:host-gateway"
      - "freegle-dev-local.localhost:host-gateway"
      - "freegle-prod-local.localhost:host-gateway"
    volumes:
      - ./delivery-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./delivery-imagesweserv.conf:/etc/nginx/imagesweserv.conf:ro
      # Local dev: empty deny file (allows Docker-network fetches). Edge overrides this with the
      # full private-range deny list (docker-compose.override.edge.yml) for SSRF protection.
      - ./delivery-weserv-deny-private.dev.conf:/etc/nginx/weserv-deny-private.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.delivery.rule=Host(`delivery.localhost`)"
      - "traefik.http.routers.delivery.entrypoints=web"
      - "traefik.http.routers.delivery.middlewares=retry-delivery"
      - "traefik.http.services.delivery.loadbalancer.server.port=80"
      # Retry middleware for connection resilience
      - "traefik.http.middlewares.retry-delivery.retry.attempts=3"
      - "traefik.http.middlewares.retry-delivery.retry.initialinterval=100ms"

  tusd:
    image: tusproject/tusd:latest
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-tusd
    profiles:
      - frontend
      - edge   # front-end host: same tusd image, prod flags via ${TUSD_COMMAND}
    networks:
      default:
        aliases:
          - tusd.localhost
    ports:
      - "${PORT_TUSD:-1080}:8080"
    # Default == the dev/CI command. The edge VM overrides it via .env:
    #   TUSD_COMMAND=-upload-dir=/srv/tusd-data -behind-proxy -base-path / -disable-cors
    # No -hooks-http: uploaded images are turned into attachments by the apiv2 /api/image
    # endpoint (client-side finalisation), matching app1 prod which runs without hooks.
    command: ${TUSD_COMMAND:--base-path=/tus/ -cors-allow-headers=baggage,sentry-trace}
    depends_on:
      reverse-proxy:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/tus/ 2>&1 | grep -E '(200|405)' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tusd.rule=Host(`tusd.localhost`)"
      - "traefik.http.routers.tusd.entrypoints=web"
      - "traefik.http.routers.tusd.middlewares=tusd-cors-headers"
      - "traefik.http.services.tusd.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.tusd-cors-headers.headers.customresponseheaders.Access-Control-Allow-Headers=Authorization, Origin, X-Requested-With, X-Request-ID, X-HTTP-Method-Override, Content-Type, Upload-Length, Upload-Offset, Tus-Resumable, Upload-Metadata, Upload-Defer-Length, Upload-Concat, Upload-Complete, Upload-Draft-Interop-Version, x-token, baggage, sentry-trace"

  # ===========================================================================
  # edge profile — user-facing front-end services, deployed on the existing
  # docker/batch host (scale-in-place, decided 2026-07-08 — see the REVISION in
  # plans/2026-06-25-frontend-server-migration.md). These services run ONLY
  # under the `edge` profile, which is in NO default profile set, so dev/CI
  # never start them and are completely unaffected. Host port bindings and the
  # adoption of the host's existing osm volumes live in the host-only
  # docker-compose.override.edge.yml; on dev the stack is validated over the
  # compose network.
  # ===========================================================================
  frontend-nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-frontend-nginx
    profiles:
      - edge
    networks:
      - default
    depends_on:
      delivery:
        condition: service_started
      tusd:
        condition: service_started
      tile-server:
        condition: service_started
        required: false
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/nginx.conf:ro
      - delivery-cache:/var/cache/nginx/wsrv_cache
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  tile-server:
    # Pinned to the EXACT image the prod host's standalone tile container
    # (confident_curran) runs, so adopting its existing osm-data volume works:
    # the PostGIS data dir is Postgres-major-version-locked and a newer
    # :latest could refuse to start on it. Upgrade deliberately after
    # adoption, not implicitly via a pull.
    image: overv/openstreetmap-tile-server@sha256:b6a79da39b6d0758368f7c62d22e49dd3ec59e78b194a5ef9dee2723b1f3fa79
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-tile-server
    profiles:
      - edge
    networks:
      - default
    command: run
    environment:
      # Emit NO CORS here — the front door adds exactly one ACAO (plan §2
      # double-CORS fix). In Stage 1 the front door is the host's native nginx
      # `maps` vhost, which already adds one ACAO and proxies to :8080; keeping
      # the container silent makes it exactly one header (and fixes today's
      # confident_curran ALLOW_CORS=enabled double-CORS). frontend-nginx takes
      # over the same single-ACAO role in a later stage.
      - ALLOW_CORS=disabled
      # Operational config carried over verbatim from the standalone prod tile
      # container (confident_curran) so the swap is behaviour-for-behaviour:
      # keep serving the already-imported osm-data AND keep applying minutely
      # OSM replication so tiles don't go stale after adoption. (The merged
      # def, written for a fresh VM import, omitted these — adopting without
      # them would silently freeze tile updates.)
      - UPDATES=enabled
      - REPLICATION_URL=https://planet.openstreetmap.org/replication/minute/
      - MAX_INTERVAL_SECONDS=60
      - THREADS=100
      - OSM2PGSQL_EXTRA_ARGS=-C 4096
      - AUTOVACUUM=on
      - TZ=UTC
    shm_size: 256m
    volumes:
      - osm-data:/data/database
      - osm-tiles:/data/tiles

  # --- wiki (wiki.ilovefreegle.org) — adopted in place from the standalone
  # wiki-media + wiki-mysql containers (scale-in-place, plan §2 step 2). Same
  # host, same data: the /var/wiki host binds and the :8088 publish live in the
  # host-only docker-compose.override.edge.yml. MediaWiki reaches its DB by the
  # hostname `wiki-mysql` ($wgDBserver in the bind-mounted LocalSettings.php),
  # which the compose service name provides on the private `wikinet` network —
  # mirroring the standalone containers. Native nginx keeps fronting the vhost
  # via 127.0.0.1:8088, so this is a same-port container swap.
  wiki-mysql:
    image: wiki-mysql:v02   # local-only custom image (not in any registry); already on the host
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-wiki-mysql
    profiles:
      - edge
    networks:
      - wikinet
    command: mysqld
    # No MYSQL_* env on purpose: the /var/wiki/db datadir (bound in the edge
    # override) is already initialised, so the entrypoint skips first-init and
    # ignores those vars. This keeps the DB root/user passwords OUT of the repo;
    # MediaWiki authenticates with the creds already in LocalSettings.php.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wiki-media:
    image: mediawiki:1.39
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-wiki-media
    profiles:
      - edge
    networks:
      - wikinet
    depends_on:
      wiki-mysql:
        condition: service_healthy

  # Elasticsearch backing the wiki's full-text search (CirrusSearch), replacing the old
  # GoogleCustomWikiSearch. Single-node cluster on the private wikinet; wiki-media reaches it
  # as http://wiki-elastic:9200. Edge profile only (prod wiki host) so it is inert for local
  # dev / CI. Heap kept small (512m) as this box is shared. ES 7.10.2 matches the CirrusSearch
  # REL1_43 that the (bind-mounted 1.43) wiki core runs.
  wiki-elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-wiki-elastic
    profiles:
      - edge
    networks:
      - wikinet
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wiki-elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s

  # Grafana Alloy (edge) — ships the edge container logs (frontend-nginx
  # uploads/delivery/tiles access + tusd events) to the Loki container via Docker
  # service discovery, closing the edge log blind spot (plan §10). Distinct from
  # the dev/monitoring `alloy` service (which ships apiv2_logs under the
  # `monitoring` profile, not active on the prod host). Alloy, not Promtail (EOL).
  alloy-edge:
    image: grafana/alloy:v1.4.2
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-alloy-edge
    profiles:
      - edge
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./alloy-edge.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
        required: false

  status:
    build:
      context: ./status-nuxt
      network: host
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-status
    profiles:
      - dev
    networks:
      - default
    ports:
      - "${PORT_STATUS:-8081}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.status.rule=Host(`status.localhost`)"
      - "traefik.http.routers.status.entrypoints=web"
      - "traefik.http.services.status.loadbalancer.server.port=3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ssl/certs:/app/ssl:ro
      - .:/project:ro
      - ./.env:/app/dotenv:rw
      - rebuild-requests:/rebuild-requests
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-freegle}
      # So the test runner can tell it is on CI. CI already builds the database
      # fresh for every run, so the pre-run reset it does locally would just be
      # repeating work - and the migrate is slow enough to time the run out.
      - CI=${CI:-}

  ai-support-helper:
    build:
      context: ./claude-agent-sdk
      network: host
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-ai-support-helper
    profiles:
      - backend
      - dev
    networks:
      - default
    ports:
      - "${PORT_AI_SUPPORT:-8083}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-support-helper.rule=Host(`ai-support-helper.localhost`)"
      - "traefik.http.routers.ai-support-helper.entrypoints=web"
      - "traefik.http.services.ai-support-helper.loadbalancer.server.port=3000"
    environment:
      # Claude auth: set CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, bills to the
      # subscription) or ANTHROPIC_API_KEY for api mode (bills to API credits). The OAuth
      # token wins when both are set (see claude-agent-sdk/auth.js). Leave both unset and
      # mount ~/.claude (see volumes) for session mode (local testing on the logged-in session).
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Unpinned alias, not a dated snapshot (snapshots get retired and the SDK
      # then 404s). On the Claude subscription (session mode) Opus is available.
      - SUPPORT_AI_MODEL=${SUPPORT_AI_MODEL:-opus}
      # Go API: verifies the caller is a mod/support/admin AND serves get_user_dump.
      - FREEGLE_API_URL=${FREEGLE_API_URL:-http://apiv2-live:8192}
      - API_URL=${FREEGLE_API_URL:-http://apiv2-live:8192}
      # Read-only DB. Local: the whole-stack percona. Edge: a read-only grant on a read replica.
      - DB_HOST=${SUPPORT_DB_HOST:-percona}
      - DB_PORT=${SUPPORT_DB_PORT:-3306}
      - DB_USER=${SUPPORT_DB_USER:-root}
      - DB_PASSWORD=${SUPPORT_DB_PASSWORD:-iznik}
      - DB_NAME=${SUPPORT_DB_NAME:-iznik}
      # Loki. Local :3100 has null user_id (health noise); edge points at the prod tunnel.
      - LOKI_URL=${SUPPORT_LOKI_URL:-http://loki:3100}
      # Sentry - real errors behind "oh dear something went wrong".
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG:-freegle}
      # Discourse - where mods/members report bugs; fixes cite topic numbers absent from support emails.
      - DISCOURSE_API_KEY=${DISCOURSE_API_KEY:-}
      - DISCOURSE_API_USER=${DISCOURSE_API_USER:-Edward_Hibbert}
      # Audit trail (who investigated whom, with what) - durable on the audit volume.
      - AUDIT_LOG_PATH=/app/audit/audit.jsonl
      # "Refer to geeks" email. The SMTP default is the local mailpit, so a
      # referral sent while developing lands at mailpit.localhost and never
      # reaches the real geeks list; edge/prod sets SUPPORT_SMTP_* to a relay.
      - GEEKS_EMAIL=${GEEKS_EMAIL:-geeks@ilovefreegle.org}
      - SUPPORT_REFERRAL_FROM=${SUPPORT_REFERRAL_FROM:-support@ilovefreegle.org}
      - SUPPORT_SMTP_HOST=${SUPPORT_SMTP_HOST:-mailpit}
      - SUPPORT_SMTP_PORT=${SUPPORT_SMTP_PORT:-1025}
      - SUPPORT_SMTP_USER=${SUPPORT_SMTP_USER:-}
      - SUPPORT_SMTP_PASS=${SUPPORT_SMTP_PASS:-}
    volumes:
      # Session mode (testing) ONLY: mount JUST the Claude OAuth credential read-only,
      # NOT the whole ~/.claude (which holds memory/transcripts/project notes). This
      # bounds what a prompt-injected read could exfiltrate. Edge/prod uses
      # ANTHROPIC_API_KEY (api mode) and should OMIT this mount entirely.
      - ${SUPPORT_CLAUDE_DIR:-/home/edward/.claude}/.credentials.json:/home/claude/.claude/.credentials.json:ro
      - ai-support-audit:/app/audit
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  embedding-sidecar:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-embedding-sidecar
    profiles:
      - backend
    networks:
      - default
    build:
      context: ./docker/embedding-sidecar
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT_EMBEDDING_SIDECAR:-3200}:3200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3200/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      - PORT=3200
      - HF_CACHE_DIR=/app/model-cache
    volumes:
      - embedding_model_cache:/app/model-cache

  host-scripts:
    image: alpine:latest
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-host-scripts
    profiles:
      - dev
    environment:
      - CI=${CI:-false}
      # Make file-sync.sh and the rebuild monitor worktree-aware: without this the
      # container has no COMPOSE_PROJECT_NAME, so both fall back to "freegle" and a
      # worktree's host-scripts syncs/rebuilds into the MAIN instance's containers.
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-freegle}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - rebuild-requests:/rebuild-requests
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        apk add --no-cache docker-cli docker-compose jq bash inotify-tools
        echo 'Starting rebuild monitor and file sync...'
        (
          echo 'Starting rebuild monitor...'
          while true; do
            for request_file in /rebuild-requests/rebuild-*.json; do
              [ ! -f "$$request_file" ] && continue
              echo "Processing rebuild request: $$request_file"
              container=$$(jq -r '.container' "$$request_file" 2>/dev/null)
              # Get the compose service name from the container's label.
              # This is reliable regardless of naming conventions.
              svc=$$(docker inspect "$$container" --format '{{index .Config.Labels "com.docker.compose.service"}}' 2>/dev/null || echo "$$container")
              if [ "$$svc" != "" ] && [ "$$container" != "null" ]; then
                echo "Rebuilding service: $$svc ($$container)"
                docker-compose -p "$${COMPOSE_PROJECT_NAME:-freegle}" stop "$$svc" 2>/dev/null || true
                docker-compose -p "$${COMPOSE_PROJECT_NAME:-freegle}" rm -f "$$svc" 2>/dev/null || true
                if docker-compose -p "$${COMPOSE_PROJECT_NAME:-freegle}" build "$$svc" &&
                   docker-compose -p "$${COMPOSE_PROJECT_NAME:-freegle}" up --no-deps -d "$$svc"; then
                  echo "Rebuild completed successfully for $$service"
                else
                  echo "Rebuild failed for $$service"
                fi
              fi
              rm -f "$$request_file"
            done
            sleep 2
          done
        ) &
        echo 'Starting file sync in background...'
        bash ./file-sync.sh &
        SYNC_PID=$$!

        # Keep container running
        while true; do
          if ! kill -0 $$SYNC_PID 2>/dev/null; then
            echo "File sync stopped, restarting..."
            bash ./file-sync.sh &
            SYNC_PID=$$!
          fi
          sleep 10
        done
    restart: unless-stopped

  # Freegle images.
  apiv2:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-apiv2
    profiles:
      - frontend
    networks:
      default:
        aliases:
          - apiv2.localhost
    build:
      context: ./iznik-server-go
      network: host
      args:
        IZNIK_SERVER_GO_BRANCH: ${IZNIK_SERVER_GO_BRANCH:-master}
    depends_on:
      percona:
        condition: service_healthy
        required: false
      batch:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
      beanstalkd:
        condition: service_healthy
      reverse-proxy:
        condition: service_healthy
        required: false
      embedding-sidecar:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      - MYSQL_HOST=percona
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PRODUCTION_ROOT_PASSWORD:-iznik}
      - IMAGE_DELIVERY=http://delivery.localhost:${PORT_TRAEFIK_HTTP:-80}
      - TUS_UPLOADER=http://tusd:8080/tus
      # In dev, uploaded photos live in the local tusd, not the production
      # store. The Go API builds delivery URLs as IMAGE_DELIVERY?url=UPLOADS+uid;
      # without this UPLOADS defaults to production (uploads.ilovefreegle.org),
      # so the resizer 404s on locally-uploaded files. Point it at local tusd's
      # file-serving path (reachable from the delivery container) so dev images
      # render — matching how V1 derives its base from TUS_UPLOADER.
      - UPLOADS=http://tusd:8080/tus/
      - PARTNER_KEY_FILE=/run/secrets/PARTNER_KEY
      # Auto-approve rollout gate: the Go Pending countdown (autoapproveat) must agree
      # with the Laravel clean-path cron about whether the 20-minute path is on, or mods
      # would see countdowns that never fire. Mirror whatever the batch env sets.
      - FREEGLE_AUTOAPPROVE_ENABLED=${FREEGLE_AUTOAPPROVE_ENABLED:-}
      - FREEGLE_AUTOAPPROVE_TRIAL_GROUPS=${FREEGLE_AUTOAPPROVE_TRIAL_GROUPS:-}
      - FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS=${FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS:-}
      # Earned-reach review gate (reviewer-pool bounding in microvolunteering.go).
      - RIPPLE_EARNED_REACH_ENABLED=${RIPPLE_EARNED_REACH_ENABLED:-}
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - LOKI_JSON_PATH=/var/log/freegle
      # Sentry API access for the user support data dump (read-only issue queries)
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG:-freegle}
      # Third-party API key allowing data-dump access without a Support/Admin login (blank = disabled)
      - USERDUMP_API_KEY=${USERDUMP_API_KEY:-}
      # Allowed domains for email tracking redirects
      - USER_SITE=www.ilovefreegle.org
      - IMAGE_DOMAIN=images.ilovefreegle.org
      - GROUP_DOMAIN=groups.ilovefreegle.org
      - AMP_SECRET=${AMP_SECRET:-test-amp-secret-for-docker}
      - TNKEY=${TNKEY:-}
      - MAPBOX_KEY=${MAPBOX_KEY:-}
      - DONATION_TARGET=${DONATION_TARGET:-}
      - DONATIONS_EXCLUDE=${DONATIONS_EXCLUDE:-}
      - EMBEDDING_SIDECAR_URL=http://embedding-sidecar:3200
      # Rollback lever for the vector-search default: set to "keyword" to revert
      # all callers (no searchmode param) to the legacy keyword cascade. Default
      # (unset) = vector-hybrid search. Removed once keyword search is retired.
      - VECTOR_SEARCH_DEFAULT=${VECTOR_SEARCH_DEFAULT:-}
      # Native ONNX pool: set both vars to bypass the HTTP sidecar for queries.
      # Model cache volume is shared with embedding-sidecar so no re-download needed.
      - EMBEDDING_ONNX_MODEL_PATH=${EMBEDDING_ONNX_MODEL_PATH:-}
      - EMBEDDING_TOKENIZER_PATH=${EMBEDDING_TOKENIZER_PATH:-}
      - SPATIAL_KNN_URL=http://spatial-knn:8194
      - SPATIAL_SERVER_URL=http://spatial:8196
      # ripple-eval is served by the routing container ('spatial') on its internal
      # no-auth port (SPATIAL_INTERNAL_PORT=8194) — NOT spatial-knn, NOT the 8196
      # auth port. Explicit so the drive-time analytics don't silently misroute.
      - ROUTING_EVAL_URL=${ROUTING_EVAL_URL:-http://spatial:8194}
    volumes:
      - apiv2_logs:/var/log/freegle
      - embedding_model_cache:/app/model-cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8192/apiv2/online || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${PORT_APIV2:-8193}:8192"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apiv2.rule=Host(`apiv2.localhost`)"
      - "traefik.http.routers.apiv2.entrypoints=web"
      - "traefik.http.routers.apiv2.middlewares=apiv2-cors,retry-api"
      - "traefik.http.services.apiv2.loadbalancer.server.port=8192"
      - "traefik.http.middlewares.apiv2-cors.headers.customresponseheaders.Access-Control-Allow-Origin=*"
      - "traefik.http.middlewares.apiv2-cors.headers.customresponseheaders.Access-Control-Allow-Methods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.apiv2-cors.headers.customresponseheaders.Access-Control-Allow-Headers=*"
      - "traefik.http.middlewares.apiv2-cors.headers.customresponseheaders.Access-Control-Max-Age=86400"
      # Retry middleware for connection resilience
      - "traefik.http.middlewares.retry-api.retry.attempts=3"
      - "traefik.http.middlewares.retry-api.retry.initialinterval=100ms"

  spatial-knn:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-spatial-knn
    profiles:
      - frontend
      # Also in `production`: batch-prod hard-depends on this service, so the
      # batch host (COMPOSE_PROFILES=backend,production,mail) must include it
      # explicitly. Newer Compose (v5) auto-enables cross-profile dependencies,
      # but older docker-compose binaries reject the project as invalid.
      - production
    networks:
      default:
        aliases:
          - spatial-knn.localhost
    build:
      context: ./iznik-spatial-go
      network: host
    depends_on:
      percona:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      - MYSQL_HOST=percona
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PRODUCTION_ROOT_PASSWORD:-iznik}
      - SPATIAL_INDEX_DIR=/data
      - SPATIAL_PORT=8194
      - SPATIAL_ADMIN_PORT=8195
      # Photon-compatible /api place search. The artifact is built by
      # iznik-routing-go/cmd/placesextract; where the file is absent the
      # dataset skips loading and /api answers 503.
      - PLACES_FILE=/places/places.jsonl.gz
    volumes:
      - spatial_data:/data
      - ${SPATIAL_DATA_DIR:-./iznik-routing-go/data}:/places:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8194/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  spatial:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-spatial
    profiles:
      - frontend
      # Also in `production`: see spatial-knn note above.
      - production
    networks:
      default:
        aliases:
          - spatial.localhost
    build:
      context: ./iznik-routing-go
      network: host
    depends_on:
      percona:
        condition: service_healthy
        required: false
      spatial-knn:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      # Bound the GC pacer by the container, not by GOGC's default doubling.
      # With neither set, Go sizes the heap at ~2x the live set and the
      # scavenger returns pages lazily, so anon RSS sat at 11.6GB against a
      # 12GiB cgroup while the artifacts account for ~5.2GB of it, squeezing
      # the mmap'd leaf tables down to 868MB resident and costing 93M file
      # refaults. GOMEMLIMIT is a SOFT target: Go keeps serving above it, it
      # only collects harder. Leave headroom below the cgroup ceiling for the
      # leaf-table page cache, and tune with a load test rather than by feel.
      - GOMEMLIMIT=${SPATIAL_GOMEMLIMIT:-9GiB}
      - GOGC=${SPATIAL_GOGC:-50}
      - SPATIAL_PORT=8196
      - SPATIAL_INTERNAL_PORT=8194
      - SPATIAL_KNN_URL=http://spatial-knn:8194
      # Override (e.g. in CI) to boot on the small committed Bristol extract so
      # the container stays up for routing-go tests without the 2.5GB UK graph.
      - OSM_PBF_PATH=${OSM_PBF_PATH:-/data/uk-latest.osm.pbf}
      - DEPRIVATION_CSV=${DEPRIVATION_CSV:-/data/uk_lsoa_quintile.csv}
      # Reach engine artifacts (see iznik-routing-go/REACH-ENGINE.md); empty = off.
      - REACH_DIR=${REACH_DIR:-}
      - MYSQL_HOST=percona
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PRODUCTION_ROOT_PASSWORD:-iznik}
      - MYSQL_DBNAME=iznik
      - JWT_SECRET=${JWT_SECRET:-secret}
    volumes:
      - ${SPATIAL_DATA_DIR:-./iznik-routing-go/data}:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8196/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 600s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spatial.rule=Host(`spatial.localhost`)"
      - "traefik.http.routers.spatial.entrypoints=web"
      - "traefik.http.services.spatial.loadbalancer.server.port=8196"

  # V2 API with LIVE production database via tunnel
  # Start with: docker compose --profile prod-live up -d apiv2-live
  # Requires: SSH tunnel to production DB on local port 1234
  # WARNING: This connects to the REAL production database!
  apiv2-live:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-apiv2-live
    profiles:
      - prod-live
    networks:
      default:
        aliases:
          - apiv2-live.localhost
    build:
      context: ./iznik-server-go
      network: host
      args:
        IZNIK_SERVER_GO_BRANCH: ${IZNIK_SERVER_GO_BRANCH:-master}
    extra_hosts:
      - "db-live:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
        required: false
      beanstalkd:
        condition: service_healthy
        required: false
      reverse-proxy:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      - MYSQL_HOST=db-live
      # Optional read replica for the DB read/write split. Empty = single-host
      # (all reads use MYSQL_HOST); set LIVE_DB_READ_HOST to route reads to a
      # replica. Writes always go to MYSQL_HOST.
      - MYSQL_HOST_READ=${LIVE_DB_READ_HOST:-}
      - MYSQL_PORT=${LIVE_DB_PORT:-1234}
      - MYSQL_USER=${LIVE_DB_USER:-root}
      - MYSQL_PASSWORD=${LIVE_DB_PASSWORD:-}
      - IMAGE_DELIVERY=https://delivery.ilovefreegle.org
      - TUS_UPLOADER=https://uploads.ilovefreegle.org:8080
      # Routing server (graph) for on-the-fly rippling drive-time analytics. Prod: the routing
      # internal no-auth port. Locally the SIBLING live container, not the dev one: this API
      # answers for the production database, so a reach measured against the dev graph and the
      # dev member index would be a local answer wearing a live label.
      - ROUTING_EVAL_URL=${LIVE_ROUTING_EVAL_URL:-http://spatial-live:8194}
      # Drive-time sample size + routing concurrency for the analytics endpoint. Tunable without a
      # rebuild. apiv2-live reaches routing over the slow SSH tunnel, so raise concurrency locally.
      - RIPPLE_ANALYTICS_SAMPLE=${RIPPLE_ANALYTICS_SAMPLE:-250}
      - RIPPLE_ANALYTICS_CONCURRENCY=${RIPPLE_ANALYTICS_CONCURRENCY:-16}
      - PARTNER_KEY_FILE=/run/secrets/PARTNER_KEY
      # Auto-approve rollout gate: the Go Pending countdown (autoapproveat) must agree
      # with the Laravel clean-path cron about whether the 20-minute path is on, or mods
      # would see countdowns that never fire. Mirror whatever the batch env sets.
      - FREEGLE_AUTOAPPROVE_ENABLED=${FREEGLE_AUTOAPPROVE_ENABLED:-}
      - FREEGLE_AUTOAPPROVE_TRIAL_GROUPS=${FREEGLE_AUTOAPPROVE_TRIAL_GROUPS:-}
      - FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS=${FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS:-}
      # Earned-reach review gate (reviewer-pool bounding in microvolunteering.go).
      - RIPPLE_EARNED_REACH_ENABLED=${RIPPLE_EARNED_REACH_ENABLED:-}
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - LOKI_JSON_PATH=/var/log/freegle
      # Sentry API access for the user support data dump (read-only issue queries)
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG_SLUG=${SENTRY_ORG_SLUG:-freegle}
      # Third-party API key allowing data-dump access without a Support/Admin login (blank = disabled)
      - USERDUMP_API_KEY=${USERDUMP_API_KEY:-}
      - USER_SITE=www.ilovefreegle.org
      - IMAGE_DOMAIN=images.ilovefreegle.org
      - GROUP_DOMAIN=groups.ilovefreegle.org
      - AMP_SECRET=${AMP_SECRET:-test-amp-secret-for-docker}
      - TNKEY=${TNKEY:-}
      - MAPBOX_KEY=${MAPBOX_KEY:-}
      - DONATION_TARGET=${DONATION_TARGET:-}
      - DONATIONS_EXCLUDE=${DONATIONS_EXCLUDE:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_AI_TOKEN=${CLOUDFLARE_AI_TOKEN:-}
      - SPATIAL_SERVER_URL=${LIVE_SPATIAL_SERVER_URL:-http://spatial-live:8196}
      # Density banding (which decides a member's reach cap, and so what /town/near reports)
      # asks this KNN index for the nearest k members. Left pointing at the dev index - which
      # holds the seeded test users, not 169k real ones - every point measures as BandUnknown
      # and /town/near quietly serves the flat fallback cap instead of the band's. That is the
      # one number the rippling explorer's "whose posts can I see" direction is about.
      - SPATIAL_KNN_URL=${LIVE_SPATIAL_KNN_URL:-http://spatial-knn-live:8194}
    volumes:
      - apiv2_logs:/var/log/freegle
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8192/apiv2/online || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "${PORT_APIV2_LIVE:-8194}:8192"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.apiv2-live.rule=Host(`apiv2-live.localhost`)"
      - "traefik.http.routers.apiv2-live.entrypoints=web"
      - "traefik.http.routers.apiv2-live.middlewares=apiv2-live-cors,apiv2-live-retry"
      - "traefik.http.middlewares.apiv2-live-cors.headers.customresponseheaders.Access-Control-Allow-Origin=*"
      - "traefik.http.middlewares.apiv2-live-cors.headers.customresponseheaders.Access-Control-Allow-Methods=GET,POST,PUT,PATCH,DELETE,OPTIONS"
      - "traefik.http.middlewares.apiv2-live-cors.headers.customresponseheaders.Access-Control-Allow-Headers=*"
      - "traefik.http.middlewares.apiv2-live-cors.headers.customresponseheaders.Access-Control-Max-Age=86400"
      - "traefik.http.middlewares.apiv2-live-retry.retry.attempts=3"
      - "traefik.http.middlewares.apiv2-live-retry.retry.initialinterval=100ms"
      - "traefik.http.services.apiv2-live.loadbalancer.server.port=8192"

  # KNN spatial index server with LIVE production database via tunnel.
  # Provides user approx-locations and other spatial indices from production data.
  # Start with: docker compose --profile prod-live up -d spatial-knn-live
