  # Loki - Log aggregation
  loki:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-loki
    profiles:
      - backend
    image: grafana/loki:3.0.0
    networks:
      - default
    ports:
      - "${PORT_LOKI:-3100}:3100"
    volumes:
      - loki-data:/loki
      - ./conf/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`loki.localhost`)"
      - "traefik.http.routers.loki.entrypoints=web"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"

  # Alloy - Log shipper to Loki
  # Reads JSON log files from containers and ships to Loki
  # For local dev: ships Go API logs from the apiv2_logs volume
  # For production: batch-prod writes to host /var/log/freegle, ship separately
  alloy:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-alloy
    profiles:
      - monitoring
    image: grafana/alloy:v1.4.2
    networks:
      - default
    volumes:
      - ./conf/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - apiv2_logs:/var/log/freegle:ro
    environment:
      - LOKI_URL=http://loki:3100
    command: ["run", "/etc/alloy/config.alloy"]
    depends_on:
      loki:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Loki backup - runs on-demand: docker compose run --rm loki-backup
  # Gracefully skips backup if GCS credentials not available (dev environments)
  # Uses host gcloud credentials (~/.config/gcloud) or service account key file
  loki-backup:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-loki-backup
    profiles:
      - backup
    build:
      context: ./scripts/backup
      dockerfile: Dockerfile
    depends_on:
      loki:
        condition: service_healthy
        required: false
    volumes:
      - loki-data:/loki:ro
      # Mount host gcloud config for credentials (user account or ADC)
      - ${GCLOUD_CONFIG_PATH:-~/.config/gcloud}:/root/.config/gcloud:ro
    environment:
      - GCS_BUCKET=${LOKI_BACKUP_BUCKET:-gs://freegle_backup_uk/loki}
      - RETENTION_DAYS=${LOKI_BACKUP_RETENTION_DAYS:-30}
    networks:
      - default

  # Batch jobs processor (Laravel)
  batch:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-batch
    profiles:
      - dev
    networks:
      - default
    build:
      context: ./iznik-batch
      dockerfile: docker/Dockerfile
    volumes:
      - ./iznik-batch:/var/www/html
      # Read-only monorepo .git so deploy:record-commit can read HEAD via the
      # RecordCommitCommand walk-up from base_path() (= /var/www/html).
      - ./.git:/var/www/.git:ro
      # Read-only: the Laravel ORM harness (iznik-batch/tests/Support/OrmHarness/)
      # reads the raw-SQL inventory this manifest is the single source of truth
      # for. iznik-batch alone is otherwise all this container can see, so a
      # relative path from inside tests/ escaping upward to tools/orm-migration/
      # resolves to nothing - found the hard way, the harness's Layer 1/2 tests
      # erroring with "file_get_contents(...): Failed to open stream" before this
      # mount existed. A bind mount of the real manifest is the honest fix (not a
      # copy into iznik-batch/tests/fixtures/, which would fork the contract and
      # drift from the source of truth silently).
      - ./tools/orm-migration/services/laravel:/var/www/orm-migration-manifest:ro
      - apiv2_logs:/var/log/freegle
    depends_on:
      percona:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      mailpit:
        condition: service_started
      mjml:
        condition: service_healthy
        required: false
      embedding-sidecar:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      - APP_NAME=Freegle Batch Jobs
      - APP_KEY=base64:JXsa9TVxy8PQIrAgimIh0+4v8U7rSYhd3/+an8WYYQc=
      - APP_ENV=local
      # Electricals classifier. eee:classify-new runs from this container's scheduler and
      # feeds the public /electricals page, so the key has to be here and not only on the
      # separate eee-batch research container.
      #
      # The accuracy the page carries (96% is-electrical, 93% condition) was measured on
      # gemini-2.0-flash-lite, which Google has since retired. Pinned to a model that
      # exists; the payload records which model the figures were measured on and flags that
      # they have not been re-measured, so the page cannot quote them as this run's own
      # accuracy. Re-measuring against Natalie's 200 labels is outstanding.
      #
      # Pinned rather than -latest deliberately: a moving alias would change the classifier
      # under us without any signal, and the accuracy claim would drift silently.
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - EEE_MODEL=${EEE_MODEL:-gemini}
      - EEE_GEMINI_MODEL=${EEE_GEMINI_MODEL:-gemini-3.5-flash-lite}
      - APP_DEBUG=true
      - RUN_MIGRATIONS=true
      - APP_URL=http://localhost
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=percona
      - DB_PORT=3306
      - DB_DATABASE=iznik
      - DB_USERNAME=root
      - DB_PASSWORD=iznik
      - PGSQL_HOST=postgres
      - PGSQL_PORT=5432
      - PGSQL_DATABASE=iznik
      - PGSQL_USERNAME=root
      - PGSQL_PASSWORD=iznik
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - QUEUE_CONNECTION=redis
      - SESSION_DRIVER=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_ENCRYPTION=null
      - MAIL_EHLO_DOMAIN=freegle-batch
      - FREEGLE_USER_SITE=http://freegle-dev-local.localhost:${PORT_FREEGLE_DEV_LOCAL:-3002}
      - FREEGLE_MOD_SITE=http://modtools-dev-local.localhost:${PORT_MODTOOLS_DEV_LOCAL:-3003}
      - FREEGLE_API_BASE_URL=http://localhost:${PORT_APIV2:-8193}
      - FREEGLE_DELIVERY_URL=http://delivery.localhost:${PORT_TRAEFIK_HTTP:-80}
      # Community News: research credential (metered key OR a `claude setup-token`
      # subscription token, which wins when set) + global kill switch.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - COMMUNITY_NEWS_OAUTH_TOKEN=${COMMUNITY_NEWS_OAUTH_TOKEN:-${CLAUDE_CODE_OAUTH_TOKEN:-}}
      - COMMUNITY_NEWS_ENABLED=${COMMUNITY_NEWS_ENABLED:-false}
      - COMMUNITY_NEWS_MODEL=${COMMUNITY_NEWS_MODEL:-claude-opus-4-8}
      - AMP_SECRET=${AMP_SECRET:-test-amp-secret-for-docker}
      - AMP_API_URL=http://apiv2.localhost:${PORT_TRAEFIK_HTTP:-80}/amp
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - MJML_URL=http://mjml/
      - EMBEDDING_SIDECAR_URL=http://embedding-sidecar:3200
      # Rollback lever for the vector-search default: set to "keyword" to revert
      # all callers (no searchmode param) to the legacy keyword cascade. Default
      # (unset) = vector-hybrid search. Removed once keyword search is retired.
      - VECTOR_SEARCH_DEFAULT=${VECTOR_SEARCH_DEFAULT:-}
      - FREEGLE_AVATAR_SERVER_URL=http://apiv2.localhost:${PORT_TRAEFIK_HTTP:-80}/avatar
      - SPATIAL_KNN_URL=http://spatial-knn:8194
      - FREEGLE_MAIL_ENABLED_TYPES=Welcome,ChatNotification,ChatNotificationUser2Mod,ChatNotificationMod2Mod,Digest,UnifiedDigest,DonationThank,DonationAsk,ChaseUp,AutoRepost,MessageExpiry,NotificationChaseUp,StoriesNewsletter,Reengage,CommunityNews
      # Post-moderation + earned-reach flags: the Laravel cron is the component that
      # actually acts on these, so they MUST reach this container from the same root
      # .env the Go countdown (apiv2/apiv2-live) reads - otherwise the countdown can
      # claim the clean path is live while the cron never runs it.
      - FREEGLE_AUTOAPPROVE_ENABLED=${FREEGLE_AUTOAPPROVE_ENABLED:-}
      - FREEGLE_AUTOAPPROVE_TRIAL_GROUPS=${FREEGLE_AUTOAPPROVE_TRIAL_GROUPS:-}
      - FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS=${FREEGLE_AUTOAPPROVE_DANGER_LOG_DAYS:-}
      - RIPPLE_EARNED_REACH_ENABLED=${RIPPLE_EARNED_REACH_ENABLED:-}
      - RIPPLE_AUTOAPPROVE_HOLD_SECONDS=${RIPPLE_AUTOAPPROVE_HOLD_SECONDS:-}
      - RIPPLE_CLEAN_VIEWS_PER_GROUP=${RIPPLE_CLEAN_VIEWS_PER_GROUP:-}
      # CI=true skips supervisor startup to prevent Laravel bootstrap race conditions.
      # Multiple supervisor workers bootstrapping Laravel simultaneously can corrupt services.php.
      - CI=${CI:-false}
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/laravel-ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 360s

  # Production batch jobs processor - connects to production database and mail
  # Start with: docker compose --profile production up -d
  # Requires secrets in .env.background (see .env.background.example for template)
  batch-prod:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-batch-prod
    profiles:
      - production
    # Give the scheduler + daemons (schedule:work, mail:spool:process, ripple, digest
    # shards) time to reach a safe stopping point on SIGTERM before Docker SIGKILLs them.
    # The default is only 10s, too short for an in-flight email send / digest sweep to
    # finish cleanly; a graceful shutdown was measured at ~9s, so 60s is generous headroom.
    # This makes a plain `docker restart` / `docker compose restart` graceful without a
    # manual -t flag (applied to the container's StopTimeout on next recreate).
    stop_grace_period: 60s
    networks:
      - default
    build:
      context: ./iznik-batch
      dockerfile: docker/Dockerfile
    # IMPORTANT: .env.background MUST exist on the live backend server with all secrets.
    # required: false only so docker compose config works in dev (where batch-prod isn't used).
    env_file:
      - path: .env.background
        required: false
    volumes:
      - ./iznik-batch:/var/www/html
      # Read-only monorepo .git so deploy:record-commit can read HEAD via the
      # RecordCommitCommand walk-up from base_path() (= /var/www/html).
      - ./.git:/var/www/.git:ro
      - /var/log/freegle:/var/log/freegle
      # Bind source uses FIREBASE_HOST_PATH (HOST path). Distinct from
      # FIREBASE_CREDENTIALS_PATH (CONTAINER path read by Laravel — always
      # /etc/firebase.json, so we DON'T set it; sharing one var leaked the
      # host path into the container's env via env_file and Laravel then
      # tried to open it inside the container — memory
      # project_push_dropped_devnull_firebase.
      - ${FIREBASE_HOST_PATH:-/dev/null}:/etc/firebase.json:ro
      # SSH key for monitor:scheduled-outcomes' host health checks (reboot
      # required / security patches / monit — see HostHealthCheck). Same
      # split-name pattern as FIREBASE_HOST_PATH: the HOST path lives in the
      # compose .env on the batch host; the container always sees
      # /etc/monitoring-ssh-key. Defaults to /dev/null (dev/CI: checks are
      # disabled anyway when FREEGLE_MONITORING_HOSTS is empty).
      - ${MONITORING_SSH_KEY_HOST_PATH:-/dev/null}:/etc/monitoring-ssh-key:ro
      # Read-only probe key for mail:deferrals:scan. Separate from the
      # monitoring key above on purpose: that one is a root shell across the
      # estate, this one only reads the outbound relay's mail queue.
      - ${MAIL_DEFERRALS_SSH_KEY_HOST_PATH:-/dev/null}:/etc/mail-deferrals-ssh-key:ro
    extra_hosts:
      - "db-host:${DB_HOST_IP:-127.0.0.1}"
      # Read replica for the DB read/write split. Falls back to the write host
      # (DB_HOST_IP) when DB_HOST_READ_IP is not set, giving single-host behaviour.
      - "db-host-read:${DB_HOST_READ_IP:-${DB_HOST_IP:-127.0.0.1}}"
      - "mail-host:${MAIL_HOST_IP:-127.0.0.1}"
    depends_on:
      loki:
        condition: service_healthy
      mjml:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The scheduler fires spatial-dependent jobs (digest reach-gate, ripple, spatial
      # index) the moment it starts, so it MUST wait for the spatial servers to finish
      # their multi-minute graph/index rebuild — otherwise those jobs hang on a not-ready
      # spatial, spin, hold their flocks and produce nothing (observed on the 2026-07-03
      # reboot). Both have /health healthchecks that only pass once loaded.
      spatial:
        condition: service_healthy
      spatial-knn:
        condition: service_healthy
    restart: unless-stopped
    environment:
      # Laravel Application
      - APP_NAME=iznik-batch
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost
      # APP_KEY comes from env_file
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      # Community News research credential: same compose substitution as the dev
      # batch service. On the prod host CLAUDE_CODE_OAUTH_TOKEN lives in the
      # project .env (it feeds ai-support-helper the same way), NOT in
      # .env.background — so wire it through here rather than duplicating the
      # secret into a second file. Empty defaults keep CI/dev unaffected.
      - COMMUNITY_NEWS_OAUTH_TOKEN=${COMMUNITY_NEWS_OAUTH_TOKEN:-${CLAUDE_CODE_OAUTH_TOKEN:-}}
      - COMMUNITY_NEWS_ENABLED=${COMMUNITY_NEWS_ENABLED:-false}
      - COMMUNITY_NEWS_MODEL=${COMMUNITY_NEWS_MODEL:-claude-opus-4-8}
      # Database (production)
      - DB_CONNECTION=mysql
      - DB_HOST=db-host
      # Reads go to the replica alias; it resolves to the write host unless
      # DB_HOST_READ_IP is set in .env.background (see extra_hosts above).
      - DB_HOST_READ=db-host-read
      - DB_PORT=3306
      - DB_DATABASE=iznik
      - DB_USERNAME=root
      # DB_PASSWORD comes from env_file
      - DB_CHARSET=utf8mb4
      - DB_COLLATION=utf8mb4_unicode_ci
      # Cache & Queue (database, not Redis - matches bulk3 config)
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=database
      # Redis (for BoundedPool worker pool semaphores only)
      - REDIS_HOST=redis
      # Mail (via smarthost)
      - MAIL_MAILER=smtp
      - MAIL_HOST=mail-host
      - MAIL_PORT=25
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_ENCRYPTION=null
      - MAIL_EHLO_DOMAIN=freegle-batch
      - MAIL_FROM_ADDRESS=noreply@ilovefreegle.org
      - MAIL_FROM_NAME=Freegle
      # Freegle Site URLs
      - FREEGLE_USER_SITE=https://www.ilovefreegle.org
      - FREEGLE_MOD_SITE=https://modtools.org
      - FREEGLE_API_BASE_URL=https://api.ilovefreegle.org
      - FREEGLE_API_V2_URL=https://api.ilovefreegle.org/apiv2
      # Freegle Branding
      - FREEGLE_SITE_NAME=Freegle
      - FREEGLE_LOGO_URL=https://www.ilovefreegle.org/icon.png
      - FREEGLE_WALLPAPER_URL=https://www.ilovefreegle.org/wallpaper.png
      # Freegle Mail Configuration
      - FREEGLE_NOREPLY_ADDR=noreply@ilovefreegle.org
      - FREEGLE_USER_DOMAIN=users.ilovefreegle.org
      - FREEGLE_MAIL_ENABLED_TYPES=Welcome,ChatNotification,ChatNotificationUser2Mod,ChatNotificationMod2Mod,Admin,ChaseUp,AutoRepost,MessageExpiry,AIImageReviewDigest,NotificationChaseUp,UnifiedDigest,Reengage,CommunityNews,DonationAsk,DonationThank,StoriesNewsletter
      # Freegle Images
      - FREEGLE_IMAGES_DOMAIN=https://images.ilovefreegle.org
      - FREEGLE_DELIVERY_URL=https://delivery.ilovefreegle.org
      - TUS_UPLOADER=https://uploads.ilovefreegle.org:8080
      - FREEGLE_WELCOME_IMAGE1=https://www.ilovefreegle.org/images/welcome1.jpg
      - FREEGLE_WELCOME_IMAGE2=https://www.ilovefreegle.org/images/welcome2.jpg
      - FREEGLE_WELCOME_IMAGE3=https://www.ilovefreegle.org/images/welcome3.jpg
      - FREEGLE_EMAIL_ASSETS_URL=https://www.ilovefreegle.org/emailimages
      - FREEGLE_RULE_FREE_IMAGE=https://www.ilovefreegle.org/emailimages/rule-free.png
      - FREEGLE_RULE_NICE_IMAGE=https://www.ilovefreegle.org/emailimages/rule-nice.png
      - FREEGLE_RULE_SAFE_IMAGE=https://www.ilovefreegle.org/emailimages/rule-safe.png
      # Loki Logging (local container)
      - LOKI_ENABLED=true
      - LOKI_URL=http://loki:3100
      - LOKI_JSON_FILE=true
      - LOKI_JSON_PATH=/var/log/freegle
      # MJML (local container)
      - MJML_URL=http://mjml/
      # Avatar generation (Go API)
      - FREEGLE_AVATAR_SERVER_URL=https://api.ilovefreegle.org/avatar
      # AMP Email
      - AMP_EMAIL_ENABLED=true
      # AMP_SECRET comes from env_file
      - AMP_API_URL=https://api.ilovefreegle.org/amp
      - AMP_READ_TOKEN_EXPIRY=168
      - AMP_WRITE_TOKEN_EXPIRY=168
      # PostgreSQL / PostGIS (for postcode remapping KNN queries)
      - PGSQL_HOST=${PGSQL_HOST:-postgres}
      - PGSQL_PORT=${PGSQL_PORT:-5432}
      - PGSQL_DATABASE=iznik
      - PGSQL_USERNAME=${PGSQL_USERNAME:-root}
      - PGSQL_PASSWORD=${PGSQL_PASSWORD:-iznik}
      # Geospatial
      - FREEGLE_SRID=3857
      # SENTRY_LARAVEL_DSN comes from env_file
      - SENTRY_SEND_DEFAULT_PII=true
      - SENTRY_TRACES_SAMPLE_RATE=1.0
      # Migrations disabled for production
      - RUN_MIGRATIONS=false
      # Rspamd HTTP API for the dormant outgoing-mail RspamdService.
      # SPAM_CHECK_ENABLED=false keeps the SpamCheckListener inactive — the
      # active spam path is the Postfix milter (see conf/postfix/main.cf).
      - RSPAMD_HOST=rspamd
      - RSPAMD_PORT=11334
      - SPAM_CHECK_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/laravel-ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  # =========================================
  # Incoming Mail Processing (Postfix)
  # =========================================
  # Receives incoming mail and routes to Laravel for processing.
  # IMPORTANT: This container does NOT receive mail until MX records are updated.
  # Safe to run - mail only arrives when DNS points to this server.

  postfix:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-postfix
    profiles:
      - mail
    build:
      context: ./conf/postfix
      dockerfile: Dockerfile
    networks:
      - default
    ports:
      - "${PORT_POSTFIX_SMTP:-25}:25"
    depends_on:
      batch-prod:
        condition: service_healthy
        required: false
    restart: unless-stopped
    volumes:
      # Persist the mail spool across container rebuilds so a deploy that
      # touches this image doesn't wipe the deferred queue.
      - postfix_spool:/var/spool/postfix
    environment:
      # Endpoint the freegle-mail-handler script POSTs incoming mail to.
      # Uses the docker-compose service alias rather than container_name so
      # COMPOSE_PROJECT_NAME changes can't break the bridge.
      BATCH_URL: http://batch-prod:8080/api/mail/incoming
    healthcheck:
      # Postfix must be running AND the batch bridge must be reachable —
      # a silently broken bridge would otherwise defer mail for hours.
      test:
        - CMD-SHELL
        - postfix status && curl -fsS --max-time 5 -o /dev/null http://batch-prod:8080/up
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  rebuild-requests:
    driver: local
  freegle_db: {}
  phpmyadmin-sessions:
    driver: local
  geoip_data:
    driver: local
  rspamd_data:
    driver: local
  spamassassin_home:
    driver: local
  postfix_spool:
    driver: local
  loki-data:
    name: ${LOKI_VOLUME:-loki-data}
  spatial_data:
    driver: local
  spatial_knn_live_data:
    driver: local
  routing_data:
    driver: local
  apiv2_logs:
    driver: local
  embedding_model_cache:
    driver: local
  # edge profile (front-end host) — see plans/2026-06-25-frontend-server-migration.md
  delivery-cache:
    driver: local   # frontend-nginx wsrv_cache (mirror of app1's 41 GB delivery cache)
  tusd-data:
    driver: local   # Docker-managed tusd upload dir; the VM override points /srv/tusd-data at NFS instead
  osm-data:
    driver: local   # tile-server PostGIS (osm-data, ~56 GB once imported)
  osm-tiles:
    driver: local   # tile-server rendered tiles (~44 GB)
  alloy-data:
    driver: local   # Grafana Alloy positions/WAL (edge log shipping)
  wiki-elastic-data:
    driver: local   # Elasticsearch index for the wiki's CirrusSearch (edge)
  ai-support-audit:
    driver: local   # durable audit log of AI Support Helper investigations (who queried whom)

networks:
  default:
    driver: bridge
  # Private network for the adopted wiki pair (edge profile), isolating
  # wiki-media <-> wiki-mysql exactly as the standalone `wikinet` did. Native
  # nginx reaches wiki-media via its published host port, not this network.
  wikinet:
    driver: bridge

secrets:
  LOVE_JUNK_API:
    file: ./secrets/lovejunk-api.txt
  LOVE_JUNK_SECRET:
    file: ./secrets/lovejunk-secret.txt
  PARTNER_KEY:
    file: ./secrets/partner-key.txt
  PARTNER_NAME:
    file: ./secrets/partner-name.txt
  IMAGE_DOMAIN:
    file: ./secrets/image-domain.txt
