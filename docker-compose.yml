      - SPATIAL_INDEX_DIR=/data
      - MYSQL_HOST=db-live
      - MYSQL_PORT=${LIVE_DB_PORT:-1234}
      - MYSQL_USER=${LIVE_DB_USER:-root}
      - MYSQL_PASSWORD=${LIVE_DB_PASSWORD:-}
      - MYSQL_DBNAME=iznik
    volumes:
      - spatial_knn_live_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8194/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Spatial server with LIVE production database via tunnel
  # Start with: docker compose --profile prod-live up -d spatial-live
  # Requires: SSH tunnel to production DB on local port ${LIVE_DB_PORT:-1234}
  # WARNING: This connects to the REAL production database!
  spatial-live:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-spatial-live
    profiles:
      - prod-live
    networks:
      default:
        aliases:
          - spatial-live.localhost
    build:
      context: ./iznik-routing-go
      network: host
    extra_hosts:
      - "db-live:host-gateway"
    depends_on:
      reverse-proxy:
        condition: service_healthy
        required: false
      spatial-knn-live:
        condition: service_healthy
        required: false
    restart: "no"
    environment:
      # Bound the GC pacer by the container, not by GOGC's default doubling.
      # With neither set, Go sizes the heap at ~2x the live set and the
      # scavenger returns pages lazily, so anon RSS sat at 11.6GB against a
      # 12GiB cgroup while the artifacts account for ~5.2GB of it, squeezing
      # the mmap'd leaf tables down to 868MB resident and costing 93M file
      # refaults. GOMEMLIMIT is a SOFT target: Go keeps serving above it, it
      # only collects harder. Leave headroom below the cgroup ceiling for the
      # leaf-table page cache, and tune with a load test rather than by feel.
      - GOMEMLIMIT=${SPATIAL_GOMEMLIMIT:-9GiB}
      - GOGC=${SPATIAL_GOGC:-50}
      - SPATIAL_PORT=8196
      - SPATIAL_INTERNAL_PORT=8194
      - SPATIAL_KNN_URL=http://spatial-knn-live:8194
      - OSM_PBF_PATH=/data/uk-latest.osm.pbf
      - DEPRIVATION_CSV=/data/uk_lsoa_quintile.csv
      # Reach engine artifacts (graph/partition/matrices snapshots). Empty =
      # engine off, PBF boot as before. See iznik-routing-go/REACH-ENGINE.md.
      - REACH_DIR=${REACH_DIR_LIVE:-}
      - MYSQL_HOST=db-live
      - MYSQL_PORT=${LIVE_DB_PORT:-1234}
      - MYSQL_USER=${LIVE_DB_USER:-root}
      - MYSQL_PASSWORD=${LIVE_DB_PASSWORD:-}
      - MYSQL_DBNAME=iznik
      - JWT_SECRET=${JWT_SECRET:-secret}
    volumes:
      - ${SPATIAL_DATA_DIR:-./iznik-routing-go/data}:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8196/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spatial-live.rule=Host(`spatial-live.localhost`)"
      - "traefik.http.routers.spatial-live.entrypoints=web"
      - "traefik.http.services.spatial-live.loadbalancer.server.port=8196"

  # Development build with local APIs - standard dev workflow
  freegle-dev-local:
    container_name: ${COMPOSE_PROJECT_NAME:-freegle}-dev-local
    profiles:
      - dev
    networks:
      default:
        aliases:
          - freegle-dev-local.localhost
    ports:
      - "0.0.0.0:${PORT_FREEGLE_DEV_LOCAL:-3002}:3002"
    extra_hosts:
      - "apiv2.localhost:host-gateway"
    build:
      context: ./iznik-nuxt3
