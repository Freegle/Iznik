# Batch-prod host ONLY - not used in dev or CI.
#
# Opt in on the prod batch host by setting in its .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.override.batchprod.yml
#
# Assigns compose services to cgroup v2 systemd slices so user-facing work is
# guaranteed priority over batch under contention, without hard caps that
# would waste idle capacity. Requires the systemd cgroup driver (already the
# case on the prod host: `docker info` shows "Cgroup Driver: systemd") and the
# slice units installed in /etc/systemd/system/ (see interactive.slice /
# batch.slice at the repo root and plans/2026-07-08-batch-host-cgroup-slices.md).
#
# Tiers:
#  - interactive.slice (CPUWeight=800): embedding-sidecar (apiv2 semantic
#    search calls it live from user requests), postfix (mail flow).
#  - batch.slice (CPUWeight=25): batch-prod (the scheduler and dominant CPU
#    consumer) plus spatial/spatial-knn (serve the batch digest path on this
#    host; the public spatial.ilovefreegle.org routing runs on db1/2/3).
#  - Everything else (loki, redis, mjml, rspamd, spamassassin, ai-support-
#    helper) stays in Docker's default cgroup under system.slice (weight 100).

services:
  embedding-sidecar:
    cgroup_parent: interactive.slice
    # memory.low on the container scope itself - protection independent of
    # whether the cgroup2 mount propagates the slice's MemoryLow recursively.
    mem_reservation: 2g

  postfix:
    cgroup_parent: interactive.slice

  batch-prod:
    cgroup_parent: batch.slice

  spatial:
    cgroup_parent: batch.slice
    # No swap for the reach engine. Its ~6GB graph heap is the kernel's
    # favourite eviction victim at the midday digest memory peak, and a
    # swapped engine turns 2.7s coarse catchments into 65s ones (measured
    # 2026-08-31: VmSwap 3.3-4.3GB, ~80 major faults/s, ripple expansion
    # collapsed for ~4h; recurred 90 minutes after a restart). memswap_limit
    # equal to mem_limit means zero swap; the limit is generous headroom over
    # the measured 6.1GB working set, and an overrun OOM-kills just this
    # container, which the restart policy heals in ~15s - strictly better
    # than the silent daily collapse. Pressure now lands on swappable idle
    # anon (photon's JVMs) instead. Durable form of the live cgroup
    # memory.swap.max=0 applied during the incident.
    #
    # Sized to the compute gate, not the host: the gate defaults to NumCPU, so
    # the rock36 resize (8 -> 12 cores, 2026-08-31) silently grew concurrency
    # by half - and the page-cache share of the working set grows with the
    # number of catchments in flight. The old 12g cap (measured 9.98GiB warm
    # set at 8 slots: 6.1GB heap + ~4GB mmap'd leaf-table cache) sat below the
    # 12-slot waterline (~6.1 + 4GB x 12/8 = ~12.1GiB), which put the cgroup into
    # perpetual internal cache reclaim on first boot after the resize: ~2GB/s
    # of refault reads, the engine unresponsive, host IO-saturated. 16g keeps
    # the same ~1.3x headroom ratio over the projected waterline. If the core
    # count changes again, re-derive: heap + (4GB * cores/8), plus a third.
    mem_limit: 16g
    memswap_limit: 16g

  spatial-knn:
    cgroup_parent: batch.slice
